<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>A782 DIGITAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c1222;--card:#141c30;--card2:#1a2440;--ink:#eef2ff;--mute:#9aa6c4;
  --line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.05);
  --acc:#6d8dff;--acc2:#7fd4ff;--acc3:#a78bfa;--ok:#34d399;--bad:#f87171;
  --fh:Inter,system-ui,sans-serif;--r:18px;--ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme=light]{
  --bg:#f3f6fc;--card:#ffffff;--card2:#f7f9fe;--ink:#152038;--mute:#5d6a86;
  --line:rgba(21,32,56,.1);--glass:#ffffff;
}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.6 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
input[type=checkbox],input[type=radio]{width:auto}
.ic{width:20px;height:20px;flex:0 0 auto}

/* Загрузка и фон: без тяжёлых эффектов */
#splash{position:fixed;inset:0;z-index:300;display:grid;place-content:center;justify-items:center;gap:14px;background:var(--bg);transition:opacity .5s,visibility .5s}
#splash.off{opacity:0;visibility:hidden}
.ring{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:spin 1s linear infinite}
#splash b{font:800 18px var(--fh);letter-spacing:.15em}
@keyframes spin{to{transform:rotate(360deg)}}
#fx,.aurora,.marquee{display:none}

/* Жоғарғы панель */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 18px var(--fh)}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc3));color:#fff;font-weight:800}
.dnav{display:flex;gap:4px;flex-wrap:wrap}
.dnav a{padding:8px 13px;border-radius:10px;color:var(--mute);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.dnav a:hover,.dnav a.on{color:var(--ink);background:var(--glass);box-shadow:inset 0 -2px 0 var(--acc)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--mute);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;transition:background .2s}
.icon-btn:hover{background:var(--glass)}

main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 18px 110px}
.pg{animation:fadeUp .45s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.ph{margin:10px 0 22px}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.ph h1,.hero h1{font:800 clamp(32px,5.5vw,52px)/1.12 var(--fh);letter-spacing:-.02em;margin:8px 0 10px}
.lead{color:var(--mute);font-size:17px;max-width:640px}
.mute{color:var(--mute)}
.sm{font-size:13px}
.w{display:inline}
.hero{padding:24px 0 6px}
h2.bl,h3{font:700 21px var(--fh);margin-bottom:12px}
.bl{margin-top:32px}

/* Карточкалар және түймелер */
.glass{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:border-color .2s,box-shadow .25s,transform .25s var(--ease)}
.glass:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line));box-shadow:0 10px 26px -18px rgba(0,0,0,.45)}
.glow{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;transition:transform .2s,background .2s,opacity .2s;text-align:center}
.btn:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--acc) 88%,#000)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--glass)}
.btn.red{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn .ic{width:17px;height:17px}
.rip{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute)}
.tag.a{color:var(--acc)}.tag.g{color:var(--ok)}
.tag .ic{width:14px;height:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px;margin-top:14px}
.card{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat b{display:block;font:800 clamp(24px,4.5vw,34px) var(--fh);line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line);margin-top:auto;font-size:13px;color:var(--mute);flex-wrap:wrap}
.win{display:flex;gap:10px;align-items:center;padding:11px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--ink)}
.ibox{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.specs{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.empty,.notice{padding:22px;border-radius:14px;border:1px dashed var(--line);text-align:center;color:var(--mute)}
.notice{border-style:solid;border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--ink)}
.spin{width:32px;height:32px;margin:26px auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:spin 1s linear infinite}
.ex{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin-top:10px;flex-wrap:wrap}

/* Hero және статистика */
.home-vip-beacon{display:flex;align-items:center;gap:14px;margin:16px 0;padding:16px 18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--vip-accent,#ffc76d) 55%,transparent);background:color-mix(in srgb,var(--vip-accent,#ffc76d) 9%,var(--card))}
.home-vip-emblem{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:14px;color:var(--vip-accent,#ffc76d);background:color-mix(in srgb,var(--vip-accent,#ffc76d) 16%,transparent)}
.home-vip-emblem .ic{width:26px;height:26px}
.home-vip-title{display:block;font:800 18px var(--fh);color:var(--vip-accent,#ffc76d)}
.home-vip-sub{display:block;font-size:13px;color:var(--mute)}
.home-vip-arr{margin-left:auto;color:var(--vip-accent,#ffc76d)}

/* Розыгрыш дөңгелегі */
.wheel-wrap{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:26px;align-items:center}
.wheel-box{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:0 auto}
#wheel{width:100%;height:100%;border-radius:50%}
.ptr{position:absolute;top:-10px;left:50%;translate:-50% 0;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--acc);z-index:3}
.hub{position:absolute;left:50%;top:50%;translate:-50% -50%;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--acc);display:grid;place-items:center;cursor:pointer;z-index:2}

/* Форма, іздеу, фильтрлер */
.search{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-top:18px}
.search input{border:0;background:transparent;flex:1;padding:9px 0;min-width:0}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin:12px 0}
.pill{border:1px solid var(--line);background:var(--card);color:var(--mute);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.form{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{display:grid;gap:6px;font-size:13px;color:var(--mute);font-weight:600}
.auth{max-width:460px}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.switch{position:relative;width:46px;height:26px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:30px;background:var(--line);cursor:pointer;transition:background .25s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s}
.switch input:checked+span{background:var(--acc)}
.switch input:checked+span::after{transform:translateX(20px)}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:12px}
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ipbox{font-family:"Courier New",monospace;font-size:22px;font-weight:700;padding:12px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:inline-block;margin:8px 0}

/* Minecraft модтары */
.mr-list{display:grid;gap:10px;margin-top:12px}
.mr{display:flex;align-items:center;gap:14px;padding:12px}
.mr img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--card2)}
.mr-i{flex:1;min-width:0}
.mr-i p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--mute)}
.mr-save .lib-toggle{font-size:12px;padding:7px 10px}

/* Кітапхана / таңдаулылар */
.lib-toggle.is-saved{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.my-library .library-list{display:grid;gap:8px}
.library-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.library-item>div:nth-child(2){flex:1;min-width:0}
.library-item b{font-size:14px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.library-item small{font-size:12px;color:var(--mute)}
.library-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--acc);background:var(--glass)}

/* Таңдаулы сөйлесу */
.cart-bar{position:sticky;bottom:96px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--acc);color:#fff;margin-top:18px}
.cart-bar .btn{background:#fff;color:var(--acc)}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:18px;font-weight:800}
.cd{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cd div{flex:1;min-width:60px;padding:10px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);text-align:center}
.cd b{display:block;font:800 24px var(--fh);font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--mute)}

/* Профиль */
.profile-heading{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px}
.profile-heading .eyebrow{width:100%}
.profile-heading h1{margin:0}
.profile-rank{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;color:var(--rank);background:color-mix(in srgb,var(--rank) 14%,transparent);font-weight:700;font-size:13px}
.profile-rank .ic{width:16px;height:16px}
.prof-banner{height:140px;background:linear-gradient(120deg,var(--acc),var(--acc3));background-size:cover;background-position:center;position:relative;overflow:hidden}
.vip-identity .prof-banner{background:linear-gradient(120deg,color-mix(in srgb,var(--vip-accent) 80%,#000),#1a1f36)}
.prof-banner-vip-top{position:relative;display:flex;justify-content:space-between;padding:14px 18px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em}
.prof-banner-vip-top span{display:inline-flex;align-items:center;gap:6px}
.prof-banner-vip-top .ic{width:15px;height:15px}
.prof-banner-huge{display:none}
.prof-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-40px 20px 12px;position:relative}
.avatar-shell{position:relative;display:inline-flex}
.avatar{width:84px;height:84px;border-radius:24px;border:4px solid var(--card);background:var(--card2);display:grid;place-items:center;overflow:hidden;color:var(--acc)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .ic{width:34px;height:34px}
.avatar-shell-vip .avatar{border-color:var(--vip-accent)}
.avatar-crown{position:absolute;top:-10px;right:-10px;width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--vip-accent);color:#1a1a1a}
.avatar-crown .ic{width:18px;height:18px}
.vip-identity-title{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:0 20px 14px;color:var(--vip-accent);font-weight:700}
.vip-identity-title small{color:var(--mute);font-size:12px}
.icons{display:flex;gap:8px;flex-wrap:wrap}
.ibtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer}
.ibtn.on{border-color:var(--acc);color:var(--acc)}
.profile-custom-status{margin:4px 0}

/* VIP / Premium (жеңілдетілген көрініс) */
.nav-vip-marker{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-weight:700;font-size:12px;color:var(--vip-accent);border:1px solid color-mix(in srgb,var(--vip-accent) 50%,transparent)}
.nav-vip-marker .ic{width:15px;height:15px}
.vip-desk-links{display:flex;gap:8px;flex-wrap:wrap}
.nexus-kicker{display:inline-flex;align-items:center;gap:7px;color:var(--acc);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nexus-kicker .ic{width:15px;height:15px}
.nexus-landing{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:34px;border-radius:24px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);margin:4px 0 40px}
.nexus-landing h1{font:800 clamp(34px,5vw,54px)/1.1 var(--fh);letter-spacing:-.02em;margin:14px 0}
.nexus-landing h1 em{font-style:normal;color:var(--acc)}
.nexus-landing-copy>p{color:var(--mute);max-width:440px}
.nexus-landing-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.nexus-simple-link{display:inline-flex;gap:6px;align-items:center;color:var(--mute);font-weight:600}
.nexus-landing-foot{display:flex;gap:8px;align-items:center;margin-top:24px;color:var(--mute);font-size:12px;font-weight:600}
.nexus-landing-foot i{width:4px;height:4px;border-radius:50%;background:var(--mute)}
.nexus-landing-stage{display:flex;justify-content:center}
.nexus-stage-halo,.nexus-stage-rings,.nexus-stage-sticker{display:none}
.nexus-stage-card{width:min(260px,100%);aspect-ratio:1.4;border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc3))}
.nexus-stage-head{display:flex;justify-content:space-between;font-weight:800}
.nexus-stage-emblem{align-self:center;color:#fff}
.nexus-stage-emblem .ic{width:50px;height:50px}
.nexus-stage-caption span{font-size:11px;opacity:.85}
.nexus-stage-caption strong{display:block;font:800 30px var(--fh)}
.nexus-levels{margin-top:30px}
.nexus-section-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.nexus-section-heading h2,.nexus-why h2,.nexus-studio-intro h2{font:800 clamp(26px,4vw,36px)/1.15 var(--fh);margin-top:6px}
.nexus-section-heading>p{color:var(--mute);max-width:380px;font-size:14px}
.nexus-tier-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.nexus-tier{display:flex;flex-direction:column;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .25s var(--ease)}
.nexus-tier:hover{border-color:var(--nexus-tier);transform:translateY(-3px)}
.nexus-tier-top{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--nexus-tier);letter-spacing:.05em}
.nexus-tier-best{padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--nexus-tier) 18%,transparent)}
.nexus-tier-pass{height:130px;margin:12px 0;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--nexus-tier) 85%,#000),color-mix(in srgb,var(--nexus-tier) 40%,#111))}
.nexus-tier-pass-a{font-weight:800;font-size:12px}
.nexus-tier-pass-icon{align-self:center}
.nexus-tier-pass-icon .ic{width:36px;height:36px}
.nexus-tier-pass-name{display:none}
.nexus-tier-pass-bottom{font-size:11px;opacity:.9;display:flex;justify-content:space-between}
.nexus-tier-body{display:flex;flex-direction:column;flex:1}
.nexus-tier-name{display:flex;justify-content:space-between;align-items:center}
.nexus-tier-name small{color:var(--nexus-tier);font-weight:700;font-size:11px}
.nexus-tier-name h3{font:800 20px var(--fh);margin:2px 0 0}
.nexus-tier-name>span{display:none}
.nexus-tier-description{font-size:13px;color:var(--mute);min-height:44px;margin:6px 0}
.nexus-tier-price{font:800 22px var(--fh);color:var(--nexus-tier);margin-bottom:10px}
.nexus-tier-price small{display:block;font:500 12px Inter;color:var(--mute)}
.nexus-tier-features{display:grid;gap:7px;padding:12px 0;border-top:1px solid var(--line);margin-top:auto}
.nexus-tier-features span{display:flex;gap:7px;align-items:center;font-size:13px}
.nexus-tier-features .ic{width:15px;height:15px;color:var(--nexus-tier)}
.nexus-tier-buttons{display:grid;gap:7px}
.nexus-tier-buy{width:100%;background:var(--nexus-tier);color:#111;font-size:13px;padding:10px}
.nexus-tier-buy .ic{display:none}
.nexus-tier-preview{background:none;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--mute);cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center}
.nexus-tier-preview .ic{width:15px;height:15px}
.nexus-levels-footnote{display:flex;gap:8px;align-items:flex-start;color:var(--mute);font-size:13px;margin:18px 0}
.nexus-levels-footnote .ic{width:17px;height:17px;flex:0 0 auto}
.nexus-why{padding:24px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin:40px 0 20px;display:grid;grid-template-columns:.8fr 1.2fr;gap:20px;align-items:center}
.nexus-why-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.nexus-why-items>div{display:grid;gap:6px;padding:14px;border-radius:14px;background:var(--card2)}
.nexus-why-items .ic{width:24px;height:24px;color:var(--acc)}
.nexus-why-items b{font-size:13px}
.nexus-why-items small{color:var(--mute);font-size:12px}

/* Member card: барлық тарифке ортақ, ішінде түсі өзгереді */
.nexus-member{--nexus-tier:var(--vip-accent);position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--nexus-tier) 22%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--nexus-tier) 45%,var(--line));margin:12px 0 22px}
.nexus-member-noise{display:none}
.nexus-member-header,.nexus-member-footer{display:flex;justify-content:space-between;gap:10px;padding:12px 20px;font-size:12px;font-weight:700;color:var(--mute);flex-wrap:wrap}
.nexus-member-header{border-bottom:1px solid var(--line)}
.nexus-member-footer{border-top:1px solid var(--line)}
.nexus-live{display:inline-flex;gap:6px;align-items:center;color:var(--nexus-tier)}
.nexus-live .ic{width:15px;height:15px}
.nexus-serial{font-size:11px}
.nexus-member-body{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(200px,.8fr);gap:20px;padding:22px 20px;align-items:center}
.nexus-micro{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.08em}
.nexus-micro b{color:var(--nexus-tier)}
.nexus-member-title{font:800 clamp(40px,6vw,64px)/1 var(--fh);color:var(--nexus-tier);margin:8px 0}
.nexus-member-title span{display:block;font:700 12px Inter;color:var(--mute);margin-top:6px;letter-spacing:.06em}
.nexus-member-user{display:flex;gap:6px;align-items:center;font-weight:700;font-size:16px}
.nexus-member-user .ic{width:17px;height:17px;color:var(--nexus-tier)}
.nexus-verified{font-size:10px;border:1px solid var(--nexus-tier);color:var(--nexus-tier);border-radius:999px;padding:2px 7px}
.nexus-member-description{color:var(--mute);font-size:14px;margin:8px 0}
.nexus-member-stats{display:flex;gap:20px;margin:14px 0}
.nexus-member-stats>span{display:grid}
.nexus-member-stats strong{font:800 24px var(--fh)}
.nexus-member-stats small{color:var(--mute);font-size:12px}
.nexus-member-expiry{display:flex;gap:6px;align-items:center;color:var(--nexus-tier);font-size:13px;font-weight:600;flex-wrap:wrap}
.nexus-member-expiry .ic{width:16px;height:16px}
.nexus-member-open{display:inline-flex;gap:7px;align-items:center;margin-top:14px;padding:10px 14px;border-radius:11px;background:var(--nexus-tier);color:#111;font-weight:700;border:0;cursor:pointer;font-size:14px}
.nexus-member-open .ic{width:16px;height:16px}
.nexus-member-art{display:grid;place-items:center}
.nexus-member-aura,.nexus-pass-shadow{display:none}
.nexus-pass{width:min(220px,80%);aspect-ratio:1.4;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(135deg,var(--nexus-tier),color-mix(in srgb,var(--nexus-tier) 35%,#111))}
.nexus-pass-top{display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.nexus-pass-top .ic{width:17px;height:17px}
.nexus-pass-symbol{align-self:center}
.nexus-pass-symbol-inner .ic{width:46px;height:46px}
.nexus-pass-bottom{display:flex;justify-content:space-between;font-size:11px;align-items:end}
.nexus-pass-bottom b{font:800 18px var(--fh)}
.nexus-pass-bottom small{text-align:right}

/* Premium Studio */
.nexus-studio{margin:24px 0;padding:24px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);scroll-margin-top:90px}
.nexus-studio.studio-focused{border-color:var(--acc)}
.nexus-studio-intro p{color:var(--mute);font-size:14px;max-width:640px}
.nexus-studio-grid{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1fr);gap:22px;margin-top:20px}
.nexus-studio-preview{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.nexus-studio-orb{display:none}
.nexus-preview-label{align-self:flex-start;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--mute)}
.nexus-preview-label .ic{width:15px;height:15px}
.nexus-preview-label i{display:none}
.nexus-preview-card{width:min(260px,100%);padding:18px;border-radius:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(135deg,var(--preview-color),var(--preview-color-2,var(--acc3)));color:#fff}
.nexus-preview-top{display:flex;justify-content:space-between;width:100%;font-size:11px;font-weight:700}
.nexus-preview-top span{opacity:.9}
.nexus-preview-avatar{width:68px;height:68px;border-radius:18px;border:2px solid #fff;display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.2)}
.nexus-preview-avatar .ic{width:32px;height:32px;color:#fff}
.nexus-preview-avatar img{width:100%;height:100%;object-fit:cover}
.nexus-preview-card>b{font:800 20px var(--fh)}
.nexus-preview-status{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.nexus-preview-card>p{font-size:12px;opacity:.9;min-height:18px}
.nexus-preview-bottom{display:flex;justify-content:space-between;width:100%;font-size:10px;font-weight:700;border-top:1px solid rgba(255,255,255,.3);padding-top:8px;margin-top:6px}
.nexus-preview-tip{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.nexus-preview-tip .ic{width:15px;height:15px}
.nexus-studio-form{min-width:0}
.nexus-field-title{display:flex;align-items:center;gap:8px;margin-top:6px}
.nexus-field-title>span{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--acc);color:#fff;font-size:11px;font-weight:800}
.nexus-field-title strong{font-size:14px}
.nexus-field-title small{margin-left:auto;color:var(--mute);font-size:12px}
.studio-colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.studio-colors label{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card2)}
.studio-colors input{position:absolute;opacity:0;width:1px;height:1px}
.studio-colors label:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.studio-colors small{font-size:11px;color:var(--mute)}
.color-dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.studio-links{border:1px solid var(--line);padding:10px;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap}
.studio-links legend{color:var(--mute);font-size:12px;padding:0 6px}
.studio-links label{display:inline-flex;gap:6px;align-items:center;padding:7px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px}
.studio-links label:has(input:checked){border-color:var(--acc);color:var(--acc)}
.studio-feedback{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
#studioShortcutCount{font-weight:700}
#studioShortcutCount.at-limit{color:var(--acc)}
.studio-actions{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.nexus-save{background:var(--acc)}
.studio-reset{font-size:13px}
.nexus-studio-note{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--mute)}
.nexus-studio-note .ic{width:14px;height:14px}
.nexus-desk{margin:16px 0 22px;padding:20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.nexus-desk-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.nexus-desk-head h2{font:800 24px var(--fh);margin:6px 0}
.nexus-desk-head p{color:var(--mute);font-size:14px}
.nexus-desk-edit{display:inline-flex;gap:6px;align-items:center;align-self:start;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;font-size:13px}
.nexus-desk-edit .ic{width:16px;height:16px}
.nexus-desk-grid{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;margin-top:16px}
.nexus-desk-saved{display:grid;gap:6px;padding:14px;border-radius:14px;background:var(--card2)}
.nexus-desk-saved>span{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.nexus-desk-saved .ic{width:15px;height:15px}
.nexus-desk-saved strong{font:800 30px var(--fh)}
.nexus-desk-saved strong small{font:500 13px Inter;color:var(--mute)}
.nexus-desk-saved>a{font-size:13px;color:var(--acc);font-weight:600}
.nexus-desk-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nexus-desk-links a{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px;min-width:0}
.nexus-desk-links a:hover{border-color:var(--acc)}
.nexus-desk-links a>.ic:first-child{width:18px;height:18px;color:var(--acc)}
.nexus-desk-links a>.ic:last-child{margin-left:auto;width:14px;height:14px;color:var(--mute)}
.nexus-desk-links a>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nexus-modal-preview{display:grid;justify-items:center;gap:12px;text-align:center}
.nexus-modal-preview h2{font:800 30px var(--fh);color:var(--nexus-tier)}
.nexus-modal-preview p{color:var(--mute);font-size:14px}
.nexus-modal-preview .nexus-tier-pass{width:min(260px,100%);height:160px}

/* Жұмсақ анимация: тек көрініс пен түйме жанасуы */
.vip-reveal{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:20px;background:rgba(10,14,28,.7);opacity:0;transition:opacity .4s}
.vip-reveal.show{opacity:1}
.vip-reveal-card{display:grid;justify-items:center;gap:10px;text-align:center;width:min(420px,100%);padding:30px 22px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);color:var(--ink)}
.vip-reveal-crown{width:84px;height:84px;display:grid;place-items:center;border-radius:50%;color:var(--vip-accent,#ffc76d);background:color-mix(in srgb,var(--vip-accent,#ffc76d) 15%,transparent)}
.vip-reveal-crown .ic{width:40px;height:40px}
.vip-reveal-card>p{color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.08em}
.vip-reveal-card>strong{font:800 32px var(--fh)}
.vip-reveal-card>span{color:var(--mute);font-size:14px}

/* Төменгі навигация және modal */
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.links{display:flex;gap:14px;flex-wrap:wrap}
.links a{color:var(--acc);font-weight:600}
.tabbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px -15px rgba(0,0,0,.4)}
.tabbar .ind{position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px)/5);border-radius:13px;background:color-mix(in srgb,var(--acc) 14%,transparent);transform:translateX(calc(var(--i,0)*100%));transition:transform .35s var(--ease)}
.tabbar a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--mute);font-size:12px;font-weight:600}
.tabbar a.on{color:var(--acc)}
.tabbar .ic{width:21px;height:21px}
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,18,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-wrap.on{opacity:1;pointer-events:all}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px 26px;transform:translateY(20px);transition:transform .3s var(--ease)}
.sheet-wrap.on .sheet{transform:none}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:100px;z-index:200;transform:translate(-50%,160%);display:flex;align-items:center;gap:10px;min-width:min(300px,92vw);max-width:92vw;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 12px 30px -12px rgba(0,0,0,.5);overflow:hidden;transition:transform .35s var(--ease)}
.toast.on{transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
.toast-emblem{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.toast-emblem .ic{width:16px;height:16px}
.toast-message{font-size:14px;font-weight:600}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--acc);transform-origin:left;animation:toastTime 3.3s linear forwards}
@keyframes toastTime{to{transform:scaleX(0)}}
.toast.bad .toast-timer{background:#fff}
.toast-message{text-align:left}

@media(max-width:820px){
  .dnav{display:none}
  main{padding-bottom:120px}
  .g2,.g3,.wheel-wrap,.filters,.nexus-studio-grid,.nexus-why,.nexus-landing,.nexus-member-body{grid-template-columns:1fr}
  .nexus-tier-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nexus-why-items{grid-template-columns:1fr}
  .nexus-desk-grid{grid-template-columns:1fr}
  .nexus-desk-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cart-bar{bottom:90px}
}
@media(min-width:821px){
  .tabbar{display:none}
  .sheet-wrap{align-items:center}
  .sheet{border-radius:20px}
  .toast{bottom:24px}
}
@media(max-width:520px){
  .nexus-tier-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .studio-actions{grid-template-columns:1fr}
  .nexus-studio{padding:16px}
  .nexus-landing{padding:22px}
  .top{padding:10px 12px}
  .brand{font-size:16px}
}

/* Анимация өшірілген (баптаудағы "Анимация" өшірулі болса) */
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition-duration:.01s!important}
body.calm .rv{opacity:1;transform:none}
</style>

async function api(m,p,b,admin){
  const h={"Content-Type":"application/json"};
  if(TOKEN) h.Authorization="Bearer "+TOKEN;
  if(admin&&ADMIN) h["x-admin-token"]=ADMIN;
  const r=await fetch(p,{method:m,headers:h,body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||"generic");e.code=j.error||"generic";e.status=r.status;throw e}
  return j;
}

function initFx(){
  const c=$("#fx"),x=c.getContext("2d");let W,H;
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight;sParts=Array.from({length:Math.min(120,Math.floor(W*H/12000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,v:Math.random()*.25+.05,a:Math.random()*6.28}))};
  size();addEventListener("resize",size);
  const loop=()=>{x.clearRect(0,0,W,H);if(S.motion){for(const p of sParts){p.y+=p.v;p.a+=.01;if(p.y>H)p.y=0;x.globalAlpha=.25+.45*Math.abs(Math.sin(p.a));x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink");x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}x.globalAlpha=1}requestAnimationFrame(loop)};
  loop();
}

/* ===================== WHEEL ===================== */
const WCOL=["#f5b041","#7dd3fc","#34d399","#f472b6","#a78bfa","#fb923c"];
function drawWheel(){
  const c=$("#wheel"); if(!c) return;
  const ctx=c.getContext("2d"),size=c.width,cen=size/2,r=cen-6,n=D.prizes.length,sl=Math.PI*2/n;
  ctx.clearRect(0,0,size,size);
  ctx.save();ctx.translate(cen,cen);ctx.rotate(WHEEL);
  D.prizes.forEach((p,i)=>{
    const a0=i*sl;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a0+sl);ctx.closePath();
    ctx.fillStyle=WCOL[i%WCOL.length];ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.25)";ctx.lineWidth=3;ctx.stroke();
    ctx.save();ctx.rotate(a0+sl/2);ctx.textAlign="right";ctx.fillStyle="#0a0b10";
    ctx.font="bold 24px Inter, sans-serif";ctx.fillText(L(p.label),r-28,8);ctx.restore();
  });
  ctx.restore();
}
async function spin(){
  if(SPIN) return;
  if(!TOKEN){toast(t("login"),true);location.hash="#me";return}
  let r;
  try{ r=await api("POST","/api/wheel/spin") }catch(e){ toast(errMsg(e),true); return }
  SPIN=true;
  const n=D.prizes.length,sl=Math.PI*2/n,cur=WHEEL;
  const base=1.5*Math.PI-(r.index*sl+sl/2);
  const delta=((base-cur)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  const target=cur+Math.PI*2*5+delta;
  const t0=performance.now(),dur=4000;
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
    WHEEL=cur+(target-cur)*e;drawWheel();
    if(p<1) requestAnimationFrame(step);
    else{SPIN=false;ME=r.user;toast(L(r.prize.label)+(r.code?` · ${r.code}`:""));render(true)}
  };
  requestAnimationFrame(step);
}

async function submitAdminForm(form){
  if(!form||!ADMIN_FORM_KINDS[form.getAttribute('id')]||form.dataset.submitting==='1')return;
  clearAdminFormError(form);
  const fields=formObj(form), kind=ADMIN_FORM_KINDS[form.getAttribute('id')];
  const hasText=prefix=>['kk','ru','en'].some(lang=>String(fields[prefix+'_'+lang]||'').trim());
  const titleError=tri('Атауын толтыр (KK, RU немесе EN).','Укажи название (KK, RU или EN).','Enter a title in KK, RU or EN.');
  if(kind==='products'){
    if(!hasText('name'))return adminFormError(form,titleError,'name_kk');
    const price=String(fields.price||'').trim();
    if(price===''||!/^\d+$/.test(price)||Number(price)>10000000){
      return adminFormError(form,tri('Бағаны дұрыс жаз: 0 ₸ немесе одан жоғары бүтін сан.','Укажи цену: целое число от 0 ₸.','Enter a valid whole-number price from 0 ₸.'),'price');
    }
  }else if(kind==='games'){
    if(!String(fields.name||'').trim())return adminFormError(form,titleError,'name');
  }else if(kind==='giveaways'){
    if(!hasText('title'))return adminFormError(form,titleError,'title_kk');
  }else if(kind==='modpacks'){
    if(!String(fields.title||'').trim())return adminFormError(form,titleError,'title');
  }
  const button=form.querySelector('[data-adminsubmit],button[type="submit"]');
  form.dataset.submitting='1';
  if(button)button.disabled=true;
  const originalText=button?button.innerHTML:'';
  if(button)button.textContent=tri('Сақталып жатыр…','Сохраняется…','Saving…');
  const status=form.querySelector('[data-admin-status]');
  if(status){status.textContent=tri('Серверге жіберіліп жатыр…','Отправка на сервер…','Sending to server…');status.style.color='var(--acc)'}
  try{
    await api('POST',ADMIN_ENDPOINT[kind],fields,true);
    await loadData();
    render(true);
    toast(tri('Сәтті қосылды / сақталды ✓','Добавлено / сохранено ✓','Added / saved ✓'));
  }catch(err){
    if(err.code==='admin_required'){
      // Render redeploy/restart clears server-side admin tokens, not sessionStorage.
      // Don't discard what the owner typed; reauthenticate and retry the clicked save.
      pendingAdminSave={id:form.getAttribute('id'),fields:{...fields}};
      clearAdminSession();
      render(true);
      toast(tri('PIN сессиясы аяқталды. Қайта PIN енгіз: тауар жоғалмайды.','Сессия PIN истекла. Введи PIN: данные не потеряются.','PIN session expired. Re-enter PIN; your draft is kept.'),true);
      document.querySelector('#pinForm input[name="pin"]')?.focus();
      return;
    }
    const reason=err.code==='title_required'?titleError:
      err.code==='admin_required'?tri('Админ сессиясы аяқталған. Қайта кір.','Сессия администратора истекла. Войди снова.','Admin session expired. Sign in again.'):
      err.code==='too_large'?tri('Дерек көлемі тым үлкен.','Слишком большой объём данных.','Payload is too large.'):
      tri('Сақталмады. Сервер жауабы: ','Не сохранено. Ответ сервера: ','Not saved. Server response: ')+(err.code||err.message||'generic')+(err.status?' (HTTP '+err.status+')':'');
    adminFormError(form,reason);
  }finally{
    delete form.dataset.submitting;
    if(form.isConnected&&button){button.disabled=false;button.innerHTML=originalText}
  }
}

let pendingIcon=null;
document.addEventListener("change",e=>{
  const el=e.target,id=el.id;
  if(id==="fLoader"){MC.loader=el.value;searchMC();return}
  if(id==="fVer"){MC.version=el.value;searchMC();return}
  if(id==="fSort"){MC.sort=el.value;searchMC();return}
  if(id==="mo"){S.motion=el.checked;localStorage.setItem("a782-motion",S.motion?"1":"0");applySettings();return}
  if(el.dataset.tofield){
    const f=el.files[0];if(!f)return;
    const max=+el.dataset.max||200;
    const img=new Image(),url=URL.createObjectURL(f);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL("image/jpeg",.7);
      URL.revokeObjectURL(url);
      if(data.length>60000){toast(t("big")||"Too large",true);return}
      el.form.elements[el.dataset.tofield].value=data;
      toast(t("saved"));
    };
    img.src=url;
  }
});

document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target,o=formObj(f);
  try{
    switch(f.getAttribute('id')){
      case "pinForm":{
        if(!ownerView()){toast(tri('Қолжетімсіз','Нет доступа','Access denied'),true);return}
        const r=await api("POST","/api/admin/login",{pin:o.pin});
        ADMIN=r.token;
        sessionStorage.setItem("a782-admin",ADMIN);
        const retry=pendingAdminSave;
        pendingAdminSave=null;
        render(true);
        if(retry){
          const target=document.getElementById(retry.id);
          if(target){
            for(const [name,value] of Object.entries(retry.fields)){
              const field=target.elements.namedItem(name);
              if(field && 'value' in field)field.value=String(value??'');
            }
            await submitAdminForm(target);
          }
        }
        return;
      }
      case "authForm":{
        const reg=AUTH==="reg";
        const r=await api("POST",reg?"/api/register":"/api/login",reg?{email:o.email,password:o.password,nick:o.nick}:{email:o.email,password:o.password});
        clearAdminSession();TOKEN=r.token;localStorage.setItem("a782-token",TOKEN);ME=r.user;
        await loadData();render(true);return;
      }
      case "vipStudioForm":{
        const shortcuts=[...f.querySelectorAll('input[name="shortcuts"]:checked')].map(x=>x.value);
        const caps=vipCapsClient();
        if(shortcuts.length>caps.count){toast(tri('Жылдам сілтемелер шегінен асты','Слишком много быстрых ссылок','Too many shortcuts'),true);return}
        const submit=f.querySelector('button[type="submit"]');if(submit?.disabled)return;
        if(submit)submit.disabled=true;
        const message=document.getElementById('studioSaveStatus');
        if(message)message.textContent=tri('Сақталып жатыр…','Сохраняется…','Saving…');
        try{
          const r=await api('POST','/api/vip/preferences',{preset:o.preset,statusEmoji:o.statusEmoji,status:o.status||'',headline:o.headline||'',shortcuts});
          ME=r.user;toast(tri('Studio сақталды ✦','Studio сохранена ✦','Studio saved ✦'));
          render(true);const status=document.getElementById('studioSaveStatus');
          if(status)status.textContent=tri('Сақталды ✓','Сохранено ✓','Saved ✓');
        }catch(error){if(message)message.textContent=tri('Сақталмады. Қайта көр.','Не сохранено. Попробуй снова.','Could not save. Try again.');throw error}
        finally{if(submit?.isConnected)submit.disabled=false}
        return;
      }
      case "profForm":{
        const r=await api("PUT","/api/me",{nick:o.nick,mc:o.mc,ff:o.ff,so2:o.so2,tg:o.tg,bio:o.bio,avatar:o.avatar,banner:o.banner,icon:pendingIcon||ME.icon});
        ME=r.user;pendingIcon=null;toast(t("saved"));render(true);return;
      }
      case "mcForm":{MC.q=$("#mcQ").value.trim();searchMC();return}
      case "cartForm":{
        if(!TOKEN){closeSheet();toast(t("login"),true);location.hash="#me";return}
        const order=await api("POST","/api/orders",{items:cart.map(i=>({id:i.id,qty:i.qty})),coupon:o.coupon||"",method:o.method||"telegram",receipt:o.receipt||""});
        cart=[];saveCart();closeSheet();
        ME=(await api("GET","/api/me")).user;
        if(order.method==="telegram"||order.method==="kaspi"){
          const ok=await copyText(orderText(order));
          window.open(D.owner.telegram,"_blank","noopener");
          toast(t("tgok"),!ok);
        } else toast(t("ok"));
        render(true);return;
      }
      case "fSite":{await api("PUT","/api/admin/site",o,true);await loadData();toast(t("saved"));render(true);return}
      case "fGame":case "fGw":case "fPr":case "fMp":{
        try{await submitAdminForm(f)}catch(err){adminFormError(f,tri("Сақтау қатесі: ","Ошибка сохранения: ","Save error: ")+(err.code||err.message||"unknown"));console.error("A782 admin submit error",err)}return;
      }
    }
  }catch(err){ toast(errMsg(err),true) }
});

const busyBalanceActions = new Set();
async function adminBal(spec){
  // All balance changes go through the existing admin-only server endpoint.
  // A pending click is locked so double-clicking can't subtract twice by accident.
  if(busyBalanceActions.has(spec))return;
  const [id,field,amount]=spec.split("|");
  const delta=Number(amount);
  if(!/^[a-zA-Z0-9_-]+$/.test(id)||!["tickets","tokens","diamonds"].includes(field)||!Number.isInteger(delta)||delta===0)return;
  busyBalanceActions.add(spec);
  const btn=[...document.querySelectorAll('[data-bal]')].find(b=>b.dataset.bal===spec);
  if(btn)btn.disabled=true;
  try{
    await api("POST",`/api/admin/users/${id}/balance`,{field,delta},true);
    await loadAdmin();
    toast(delta<0?tri('Билет алынды ✓','Билеты списаны ✓','Tickets removed ✓'):tri('Баланс жаңартылды ✓','Баланс обновлён ✓','Balance updated ✓'));
  }catch(e){toast(errMsg(e),true)}
  finally{
    busyBalanceActions.delete(spec);
    if(btn&&btn.isConnected)btn.disabled=false;
  }
}
async function adminOrder(spec){
  const [id,status]=spec.split("|");
  try{ await api("POST",`/api/admin/orders/${id}/status`,{status},true); loadAdmin() }
  catch(e){ toast(errMsg(e),true) }
}
