async function api(method, path, body, admin) {
  const headers = {"Content-Type":"application/json"};
  if (TOKEN) headers.Authorization = "Bearer " + TOKEN;
  if (admin && ADMIN) headers["x-admin-token"] = ADMIN;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), method === "GET" ? 12000 : 25000);
  try {
    let response, data;
    try {
      response = await fetch(path, {
        method, headers, signal: controller.signal,
        body: body === undefined || body === null ? undefined : JSON.stringify(body)
      });
      data = await response.json();
    } catch (error) {
      if (!response || response.ok || controller.signal.aborted) {
        const code = controller.signal.aborted ? "request_timeout" : "connection_error";
        throw Object.assign(new Error(code), {code});
      }
    }
    if (!response.ok) {
      const code = data?.error || "generic";
      throw Object.assign(new Error(code), {code, status:response.status});
    }
    return data;
  } finally {
    clearTimeout(timeout);
  }
}

document.addEventListener("pointerdown", event => {
  if (!motionEnabled()) return;
  const button = event.target.closest(".btn:not(:disabled)");
  if (!button) return;
  const rect = button.getBoundingClientRect();
  const ripple = document.createElement("i");
  ripple.className = "rip";
  ripple.style.left = (event.clientX - rect.left) + "px";
  ripple.style.top = (event.clientY - rect.top) + "px";
  button.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

  "VIP-FREE": {title:"FREE", motif:"glacier", accent:"#83ddff", highlight:"#c6f4ff", icon:"sparkles", features:[500,9,5]},

function premiumTier(vip){
  const value=vip?.tier || vip?.name || vip?.visualTier;

function premiumDesign(tier){
  const base=PREMIUM_DEFAULTS[tier]||PREMIUM_DEFAULTS["VIP-PLUS"];
  const saved=D?.vipDesigns?.[tier]||{};
  const color=(value,fallback)=>typeof value==="string"&&/^#[0-9a-f]{6}$/i.test(value)?value:fallback;
  return {
    ...base,
    title:typeof saved.title==="string"&&saved.title.trim()?saved.title.trim().slice(0,26):base.title,
    motif:PREMIUM_MOTIFS.includes(saved.motif)?saved.motif:base.motif,
    accent:color(saved.accent,base.accent), highlight:color(saved.highlight,base.highlight),
    description:L(saved.description)||({

async function saveAppearance(form){

  const button=form.querySelector('button[type="submit"]');
  form.dataset.busy="1";
  button.disabled=true;
  try{
    const value=formObj(form);
    const copy=Object.fromEntries(siteCopyGroups().flatMap(([,fields])=>fields.map(([key])=>[
      key,Object.fromEntries(["kk","ru","en"].map(lang=>[lang,value[key+"_"+lang]||""]))
    ])));
    const {name,logoText,logoImage,heroImage,palette,defaultTheme,snow,motion}=value;
    await api("PUT","/api/admin/appearance",{
      name,logoText,logoImage,heroImage,palette,defaultTheme,snow,motion,copy,
      aurora:form.elements.aurora.checked, spinSound:form.elements.spinSound.checked,
      soundVolume:Number(value.soundVolume)
    },true);
    await loadData();
    render(true);
    toast(t("saved"));
  }finally{
    delete form.dataset.busy;
    button.disabled=false;
  }
}

function fillForm(form,obj){
  for(const el of form.elements){
    if(!el.name) continue;
    if(el.type==="checkbox"){el.checked=!!obj[el.name];continue}
    const m=el.name.match(/^(.+)_(kk|ru|en)$/);
    let v;
    if(m) v=(obj[m[1]]||{})[m[2]];
    else if(el.name==="keys") v=(obj.keyMods||[]).join(", ");
    else if(el.name==="images") v=(Array.isArray(obj.images)&&obj.images.length?obj.images:(obj.img?[obj.img]:[])).join("\n");
    else v=obj[el.name];
    el.value=v??"";
  }
}

}

const REEL_LENGTH = 36;
const REEL_START = 4;
const REEL_GOAL = 28;
let REEL_LAST_WIN=null;
let reelAccountId=null;
let reelReadyAt=0;
let reelCooldownTimer;
let reelAnchor=REEL_START;
let completeReelAnimation=null;

let reelAudioContext=null;
const reelAudioNotes=new Set();

function reelSoundAllowed(){
  return S.sound===true && D?.appearance?.spinSound!==false &&
    Number(D?.appearance?.soundVolume??24)>0;
}
function reelSoundLabel(){
  return reelSoundAllowed()
    ? tri("Дыбыс қосулы","Звук включён","Sound on")
    : tri("Дыбыс өшірулі","Звук выключен","Sound off");
}
function reelSoundButton(){

  return `<button class="btn ghost sm reel-sound" type="button" data-reel-sound aria-pressed="${reelSoundAllowed()}" ${disabled?"disabled":""}>
    ${ic(reelSoundAllowed()?"volume":"mute-volume")} <span>${reelSoundLabel()}</span>
  </button>`;
}
function syncReelSoundButtons(){
  $$("[data-reel-sound]").forEach(button=>{
    button.setAttribute("aria-pressed",String(reelSoundAllowed()));
    button.innerHTML=ic(reelSoundAllowed()?"volume":"mute-volume")+" <span>"+reelSoundLabel()+"</span>";
  });
}
// Create or resume the browser audio context while the click is still trusted.
function prepareReelAudio(){
  if(!reelSoundAllowed())return;
  try{
    const Audio=window.AudioContext || window.webkitAudioContext;
    if(!Audio)return;
    reelAudioContext ||= new Audio();
    if(reelAudioContext.state!=="running")reelAudioContext.resume().catch(()=>{});
  }catch{}
}
function stopReelAudio(){
  for(const note of reelAudioNotes){
    try{note.stop()}catch{}
    note.disconnect();
  }
  reelAudioNotes.clear();
}
function playReelNote(at,frequency,duration,strength,type="sine"){
  const context=reelAudioContext;
  if(!reelSoundAllowed() || context?.state!=="running" || document.hidden)return;
  try{
    const oscillator=context.createOscillator();
    const gain=context.createGain();
    const volume=Math.max(0,Math.min(.6,Number(D?.appearance?.soundVolume??24)/100));
    oscillator.type=type;
    oscillator.frequency.setValueAtTime(frequency,at);
    gain.gain.setValueAtTime(.0001,at);
    gain.gain.linearRampToValueAtTime(Math.max(.0001,strength*volume),at+.005);
    gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.onended=()=>{
      reelAudioNotes.delete(oscillator);
      oscillator.disconnect();
      gain.disconnect();
    };
    oscillator.start(at);
    oscillator.stop(at+duration+.012);
    reelAudioNotes.add(oscillator);
  }catch{}
}
function playReelTicks(duration){
  stopReelAudio();
  if(duration<500 || !reelSoundAllowed() || reelAudioContext?.state!=="running")return;
  const start=reelAudioContext.currentTime+.014;
  const positions=[.025,.052,.082,.117,.156,.202,.254,.315,.383,.463,.553,.652,.763,.881,.972];
  positions.forEach((fraction,index)=>playReelNote(
    start+duration/1000*fraction,640-index*15,.032,.105,"triangle"
  ));
}
function playReelWin(){
  if(!reelSoundAllowed() || reelAudioContext?.state!=="running")return;
  const start=reelAudioContext.currentTime+.016;
  playReelNote(start,523.25,.24,.10);

function initPrizeReel(){
  const track=document.getElementById('reelTrack');
  if(!track||!D?.prizes?.length||completeReelAnimation)return;
  reelAnchor=REEL_START;
  const selector=`[data-reel-n="${REEL_START}"]`;
  if(REEL_LAST_WIN)track.querySelector(selector).outerHTML=prizeCard(REEL_LAST_WIN,REEL_START);
  track.style.transition='none';
  positionReel(track,reelAnchor);
  track.querySelectorAll('.is-at-rest,.is-selected').forEach(el=>el.classList.remove('is-at-rest','is-selected'));
  track.querySelector(selector)?.classList.add(REEL_LAST_WIN?'is-selected':'is-at-rest');
}
function animateReelTo(prize,previousPrize){
  const track=document.getElementById('reelTrack');
  const machine=document.getElementById('winterReel');
  if(!track||!D?.prizes?.length)return Promise.resolve();
  const startSelector=`[data-reel-n="${REEL_START}"]`;
  const goalSelector=`[data-reel-n="${REEL_GOAL}"]`;
  return new Promise(resolve=>{
    const duration=(!S.motion||D?.appearance?.motion==='off'||window.matchMedia('(prefers-reduced-motion: reduce)').matches)?180:5200;
    if(previousPrize)track.querySelector(startSelector).outerHTML=prizeCard(previousPrize,REEL_START);
    track.querySelector(goalSelector).outerHTML=prizeCard(prize,REEL_GOAL);
    track.querySelectorAll('.is-at-rest,.is-selected').forEach(el=>el.classList.remove('is-at-rest','is-selected'));
    machine?.classList.add('is-spinning');
    track.style.transition='none';
    positionReel(track,REEL_START);
    void track.offsetHeight;
    let done=false;
    let deadline;
    function finish(showResult=true){
      if(done)return;
      done=true;
      clearTimeout(deadline);
      stopReelAudio();
      track.removeEventListener('transitionend',onEnd);
      machine?.classList.remove('is-spinning');
      completeReelAnimation=null;
      if(showResult && track===document.getElementById('reelTrack')){
        track.style.transition='none';
        reelAnchor=REEL_GOAL;
        positionReel(track,reelAnchor);
        track.querySelector(goalSelector)?.classList.add('is-selected');
        if(!document.hidden)playReelWin();
      }
      resolve();
    }
    function onEnd(event){
      if(event.target===track&&event.propertyName==='transform')finish();
    }
    if(document.hidden){finish();return}
    completeReelAnimation=finish;
    track.addEventListener('transitionend',onEnd);
    deadline=setTimeout(finish,duration+300);
    track.style.transition=`transform ${duration}ms cubic-bezier(.10,.77,.11,1)`;
    positionReel(track,REEL_GOAL);
    playReelTicks(duration);
  });
}

async function spin(){
  if(SPIN)return;
  if(ME && TOKEN && D?.prizes?.length)prepareReelAudio();
  if(navigator.locks && ME){
    let callbackStarted=false;
    try{
      await navigator.locks.request('a782-wheel:'+ME.id,{ifAvailable:true},async lock=>{
        callbackStarted=true;
        if(!lock){toast(E[LANG].spin_busy,true);return}
        await performSpin();
      });
      return;
    }catch(error){
      if(callbackStarted){toast(errMsg(error),true);return}
    }
  }
  return performSpin();
}
async function performSpin(){
  if(SPIN)return;
  if(!TOKEN||!ME){toast(t('login'),true);location.hash='#me';return}
  if(!D?.prizes?.length){toast(t('nores'),true);return}
  const session=TOKEN, account=ME.id, pendingKey='a782-spin-pending:'+account;
  SPIN=true;
  try{
    syncSpinButton();
    const announcement=document.getElementById('reelAnnouncement');
    if(announcement)announcement.textContent=tri('Жүлде анықталып жатыр…','Выбираем приз…','Selecting reward…');
    let requestId=localStorage.getItem(pendingKey);
    if(!requestId){
      requestId=crypto.randomUUID?.() || Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(pendingKey,requestId);
    }
    const result=await api('POST','/api/wheel/spin',{requestId});
    if(result?.user?.id!==account || !result.prize)throw Object.assign(new Error('connection_error'),{code:'connection_error'});
    localStorage.removeItem(pendingKey);
    if(session!==TOKEN)return;
    const previousPrize=REEL_LAST_WIN;
    ME=result.user;
    reelReadyAt=Date.now()+(result.cooldownMs||0);
    REEL_LAST_WIN=result.prize;
    await animateReelTo(result.prize,previousPrize);
    if(session!==TOKEN)return;
    updateReelResult();
    toast(L(result.prize.label)+(result.code?` · ${result.code}`:''));
  }catch(error){
    if(error.status && error.status<500 && ![408,429].includes(error.status) && error.code!=='spin_busy')localStorage.removeItem(pendingKey);
    if(session!==TOKEN)return;
    const message=['request_timeout','connection_error'].includes(error.code)
      ? tri('Байланыс үзілді. Қайта басқанда осы айналым тексеріледі.','Связь прервалась. Повторный клик проверит это вращение.','Connection interrupted. Clicking again checks this spin.')
      : errMsg(error);
    const announcement=document.getElementById('reelAnnouncement');
    if(announcement)announcement.textContent=message;
    toast(message,true);
  }finally{
    SPIN=false;
    syncSpinButton();
  }
}

let mcSearchRevision=0;
async function searchMC(page=0){
  const revision=++mcSearchRevision;
  MC.page=page;
  MC.error="";
  if(MC.source==="curseforge"&&!mcEnabled(MC.source)){
    MC.hits=[];
    MC.pagination=null;
    updateMC();
    return;
  }
  MC.hits="loading";
  updateMC();
  const params=new URLSearchParams({
    source:MC.source||"modrinth",q:MC.q,type:MC.type,loader:MC.loader||"",version:MC.version||"",sort:MC.sort||"downloads",page
  });
  try{
    const data=await api("GET","/api/mc/search?"+params);
    if(revision!==mcSearchRevision)return;
    MC.hits=Array.isArray(data.hits)?data.hits:[];
    MC.pagination=data.pagination||null;
  }catch(error){
    if(revision!==mcSearchRevision)return;
    MC.hits="error";
    MC.error=errMsg(error);
    MC.pagination=null;
  }
  updateMC();
}

const ADMIN_ENDPOINT={games:"/api/admin/games",giveaways:"/api/admin/giveaways",products:"/api/admin/products",modpacks:"/api/admin/modpacks"};

// Explicit, mobile-friendly admin add/edit handler.
// Never lets browser-native required-field validation swallow the Save/Add click.
const ADMIN_FORM_KINDS={fGame:"games",fGw:"giveaways",fPr:"products",fMp:"modpacks"};
function adminFormError(form,message,focusName){
  let box=form.querySelector('[data-admin-error]');
  if(!box){box=document.createElement('p');box.dataset.adminError='1';box.setAttribute('role','alert');box.style.cssText='color:var(--bad);font-size:13px;margin-top:6px;white-space:pre-wrap';form.appendChild(box)}
  box.textContent=message;
  const status=form.querySelector('[data-admin-status]');
  if(status){status.textContent=message;status.style.color='var(--bad)'}
  toast(message,true);
  const field=focusName && form.elements.namedItem(focusName);
  if(field&&typeof field.focus==='function')field.focus({preventScroll:false});
}
function clearAdminFormError(form){const box=form.querySelector('[data-admin-error]');if(box)box.remove();const status=form.querySelector('[data-admin-status]');if(status){status.textContent='';status.style.color='var(--mute)'}}
async function submitAdminForm(form){
  if(!form||!ADMIN_FORM_KINDS[form.getAttribute('id')]||form.dataset.submitting==='1')return;
  clearAdminFormError(form);
  const fields=formObj(form), kind=ADMIN_FORM_KINDS[form.getAttribute('id')];
  const hasText=prefix=>['kk','ru','en'].some(lang=>String(fields[prefix+'_'+lang]||'').trim());
  const titleError=tri('Атауын толтыр (KK, RU немесе EN).','Укажи название (KK, RU или EN).','Enter a title in KK, RU or EN.');
  if(kind==='products'){
    if(!hasText('name'))return adminFormError(form,titleError,'name_kk');
    const price=String(fields.price||'').trim();
    if(price===''||!/^\d+$/.test(price)||Number(price)>10000000){
      return adminFormError(form,tri('Бағаны дұрыс жаз: 0 ₸ немесе одан жоғары бүтін сан.','Укажи цену: целое число от 0 ₸.','Enter a valid whole-number price from 0 ₸.'),'price');
    }
  }else if(kind==='games'){
    if(!String(fields.name||'').trim())return adminFormError(form,titleError,'name');
  }else if(kind==='giveaways'){
    if(!hasText('title'))return adminFormError(form,titleError,'title_kk');
  }else if(kind==='modpacks'){
    if(!String(fields.title||'').trim())return adminFormError(form,titleError,'title');
  }
  const button=form.querySelector('[data-adminsubmit],button[type="submit"]');
  form.dataset.submitting='1';
  if(button)button.disabled=true;
  const originalText=button?button.innerHTML:'';
  if(button)button.textContent=tri('Сақталып жатыр…','Сохраняется…','Saving…');
  const status=form.querySelector('[data-admin-status]');
  if(status){status.textContent=tri('Серверге жіберіліп жатыр…','Отправка на сервер…','Sending to server…');status.style.color='var(--acc)'}
  try{
    await api('POST',ADMIN_ENDPOINT[kind],fields,true);
    await loadData();
    render(true);
    toast(tri('Сәтті қосылды / сақталды ✓','Добавлено / сохранено ✓','Added / saved ✓'));
  }catch(err){
    if(err.code==='admin_required'){
      // Render redeploy/restart clears server-side admin tokens, not sessionStorage.
      // Don't discard what the owner typed; reauthenticate and retry the clicked save.
      pendingAdminSave={id:form.getAttribute('id'),fields:{...fields}};
      clearAdminSession();
      render(true);
      toast(tri('PIN сессиясы аяқталды. Қайта PIN енгіз: тауар жоғалмайды.','Сессия PIN истекла. Введи PIN: данные не потеряются.','PIN session expired. Re-enter PIN; your draft is kept.'),true);
      document.querySelector('#pinForm input[name="pin"]')?.focus();
      return;
    }
    const reason=err.code==='title_required'?titleError:
      err.code==='admin_required'?tri('Админ сессиясы аяқталған. Қайта кір.','Сессия администратора истекла. Войди снова.','Admin session expired. Sign in again.'):
      err.code==='too_large'?tri('Дерек көлемі тым үлкен.','Слишком большой объём данных.','Payload is too large.'):
      tri('Сақталмады. Сервер жауабы: ','Не сохранено. Ответ сервера: ','Not saved. Server response: ')+(err.code||err.message||'generic')+(err.status?' (HTTP '+err.status+')':'');
    adminFormError(form,reason);
  }finally{
    delete form.dataset.submitting;
    if(form.isConnected&&button){button.disabled=false;button.innerHTML=originalText}
  }
}

    img.onload=()=>{
      if(!form.isConnected){URL.revokeObjectURL(url);return}
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL("image/jpeg",.7);
      URL.revokeObjectURL(url);
      if(data.length>60000){toast(t("big")||"Too large",true);return}
      form.elements[el.dataset.tofield].value=data;

      if(remove)remove.checked=false;
      toast(t("saved"));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toast(E[LANG].invalid_image_url,true)};
    img.src=url;
  }
});

 const max=vipCapsClient().count;
 const el=document.getElementById('studioShortcutCount');
 if(el){el.textContent=count+' / '+max;el.classList.toggle('at-limit',count===max)}

document.addEventListener("submit",async e=>{
  e.preventDefault();

    switch(f.getAttribute('id')){
      case "pinForm":{
        if(!ownerView()){toast(tri('Қолжетімсіз','Нет доступа','Access denied'),true);return}

        ADMIN=r.token;
        sessionStorage.setItem("a782-admin",ADMIN);
        const retry=pendingAdminSave;
        pendingAdminSave=null;
        render(true);
        if(retry){
          const target=document.getElementById(retry.id);
          if(target){
            for(const [name,value] of Object.entries(retry.fields)){
              const field=target.elements.namedItem(name);
              if(field && 'value' in field)field.value=String(value??'');
            }
            await submitAdminForm(target);
          }
        }
        return;
      }
      case "authForm":{
        const reg=AUTH==="reg";
        const r=await api("POST",reg?"/api/register":"/api/login",reg?{email:o.email,password:o.password,nick:o.nick}:{email:o.email,password:o.password});
        clearAdminSession();TOKEN=r.token;localStorage.setItem("a782-token",TOKEN);ME=r.user;
        await loadData();render(true);return;
      }
      case "vipStudioForm":{
        const shortcuts=[...f.querySelectorAll('input[name="shortcuts"]:checked')].map(x=>x.value);
        const caps=vipCapsClient();
        if(shortcuts.length>caps.count){toast(tri('Жылдам сілтемелер шегінен асты','Слишком много быстрых ссылок','Too many shortcuts'),true);return}
        const submit=f.querySelector('button[type="submit"]');if(submit?.disabled)return;
        if(submit)submit.disabled=true;
        const message=document.getElementById('studioSaveStatus');
        if(message)message.textContent=tri('Сақталып жатыр…','Сохраняется…','Saving…');
        try{
          const r=await api('POST','/api/vip/preferences',{preset:o.preset,statusEmoji:o.statusEmoji,status:o.status||'',headline:o.headline||'',shortcuts});
          ME=r.user;toast(tri('Studio сақталды ✦','Studio сохранена ✦','Studio saved ✦'));

          if(status)status.textContent=tri('Сақталды ✓','Сохранено ✓','Saved ✓');

        finally{if(submit?.isConnected)submit.disabled=false}
        return;
      }
      case "profForm":{
        const r=await api("PUT","/api/me",{nick:o.nick,mc:o.mc,ff:o.ff,so2:o.so2,tg:o.tg,bio:o.bio,avatar:editedImage(f,"avatar",ME.avatar),banner:editedImage(f,"banner",ME.banner),icon:pendingIcon||ME.icon});

      }

      case "appearanceForm":{await saveAppearance(f);return}
      case "couponAdminForm":{await saveCoupon(f);return}
      case "vipPlanForm":{await saveVipPlan(f);return}

        await api("PUT","/api/admin/site",{...o,avatar:editedImage(f,"avatar",D.owner.avatar),banner:editedImage(f,"banner",D.owner.banner)},true);

const busyBalanceActions = new Set();
async function adminBal(spec){
  // All balance changes go through the existing admin-only server endpoint.
  // A pending click is locked so double-clicking can't subtract twice by accident.
  if(busyBalanceActions.has(spec))return;
  const [id,field,amount]=spec.split("|");
  const delta=Number(amount);
  if(!/^[a-zA-Z0-9_-]+$/.test(id)||!["tickets","tokens","diamonds"].includes(field)||!Number.isInteger(delta)||delta===0)return;
  busyBalanceActions.add(spec);
  const btn=[...document.querySelectorAll('[data-bal]')].find(b=>b.dataset.bal===spec);
  if(btn)btn.disabled=true;
  try{
    await api("POST",`/api/admin/users/${id}/balance`,{field,delta},true);
    await loadAdmin();
    toast(delta<0?tri('Билет алынды ✓','Билеты списаны ✓','Tickets removed ✓'):tri('Баланс жаңартылды ✓','Баланс обновлён ✓','Balance updated ✓'));
  }catch(e){toast(errMsg(e),true)}
  finally{
    busyBalanceActions.delete(spec);
    if(btn&&btn.isConnected)btn.disabled=false;
  }
}
async function adminOrder(spec){
  const [id,status]=spec.split("|");
  try{ await api("POST",`/api/admin/orders/${id}/status`,{status},true); loadAdmin() }
  catch(e){ toast(errMsg(e),true) }
}

  if(name==="Inter"||document.querySelector(`link[data-lkfont="${name}"]`))return;
  const l=document.createElement("link");l.rel="stylesheet";l.dataset.lkfont=name;
  l.href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(name).replace(/%20/g,"+")}:wght@400;500;600;700;800;900&display=swap`;
  document.head.appendChild(l);
}

/* ---------- snow canvas behind the whole site ---------- */
const cv=document.createElement("canvas");cv.id="snowCanvas";cv.setAttribute("aria-hidden","true");
document.body.prepend(cv);
const ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,flakes=[],sprites={},spriteKey="",raf=0,last=0,mx=-999,my=-999,sdy=0,tt=0;
function makeSprite(kind,color){
  const s=64,c=document.createElement("canvas");c.width=c.height=s;const g=c.getContext("2d");g.translate(s/2,s/2);
  if(kind==="dot"){
    const gr=g.createRadialGradient(0,0,0,0,0,s/2);gr.addColorStop(0,color);gr.addColorStop(.5,color);gr.addColorStop(1,hexA(color,0));
    g.fillStyle=gr;g.beginPath();g.arc(0,0,s/2,0,Math.PI*2);g.fill();
  }else{
    g.strokeStyle=color;g.lineWidth=3.2;g.lineCap="round";
    for(let i=0;i<6;i++){
      g.save();g.rotate(i*Math.PI/3);
      g.beginPath();g.moveTo(0,0);g.lineTo(0,-26);
      g.moveTo(0,-14);g.lineTo(-7,-21);g.moveTo(0,-14);g.lineTo(7,-21);
      g.stroke();g.restore();
    }
    g.fillStyle=color;g.beginPath();g.arc(0,0,3.4,0,Math.PI*2);g.fill();
  }
  return c;
}
function newFlake(initial,cfg){
  const z=.2+Math.random()*.8;
  const kind=cfg.shape==="dot"?"dot":cfg.shape==="flake"?"flake":(z>.58&&Math.random()<.55?"flake":"dot");
  return {x:Math.random()*W,y:initial?Math.random()*H:-12,z,kind,
    r:1.6*cfg.size*(.5+z*1.3),vy:28+52*z+Math.random()*10,fr:.5+Math.random()*1.3,ph:Math.random()*6.28,
    rot:Math.random()*6.28,vr:(Math.random()-.5)*1.1};
}
function syncSnow(){
  const cfg=snowCfg(),want=cfg.on?Math.round(cfg.amount*(innerWidth<700?.55:1)):0;
  const key=cfg.color+"|"+cfg.shape+"|"+cfg.size;
  if(key!==spriteKey){spriteKey=key;sprites={dot:makeSprite("dot",cfg.color),flake:makeSprite("flake",cfg.color)};flakes=[]}
  while(flakes.length<want)flakes.push(newFlake(true,cfg));
  if(flakes.length>want)flakes.length=want;
}
function sizeSnow(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
}
const snowRuns=()=>{const c=snowCfg();return !document.hidden&&c.on&&c.amount>0&&!isCalm()&&!reduced()};
function frame(ts){
  raf=0;
  if(!snowRuns()){ctx.clearRect(0,0,W,H);return}
  const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;tt+=dt;
  const cfg=snowCfg(),spd=cfg.speed,wind=cfg.wind,sway=cfg.sway,par=sdy*.22;
  ctx.clearRect(0,0,W,H);
  for(const f of flakes){
    f.y+=f.vy*spd*dt-par*f.z;
    f.x+=(wind*22*f.z+Math.sin(tt*f.fr+f.ph)*sway*16*f.z)*dt;
    f.rot+=f.vr*dt;
    const dx=f.x-mx,dy=f.y-my,d2=dx*dx+dy*dy;
    if(d2<14400&&d2>1){const d=Math.sqrt(d2),k=(120-d)/120;f.x+=dx/d*k*150*dt*f.z;f.y+=dy/d*k*150*dt*f.z}
    const m=f.r*3;
    if(f.y>H+m){f.y=-m;f.x=Math.random()*W}else if(f.y<-m*2){f.y=H+m}
    if(f.x<-m)f.x=W+m;else if(f.x>W+m)f.x=-m;
    ctx.globalAlpha=.35+.6*f.z;
    if(f.kind==="flake"){
      const D=f.r*5;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.drawImage(sprites.flake,-D/2,-D/2,D,D);ctx.restore();
    }else{const D=f.r*4;ctx.drawImage(sprites.dot,f.x-D/2,f.y-D/2,D,D)}
  }
  ctx.globalAlpha=1;sdy=0;
  raf=requestAnimationFrame(frame);
}
function kickSnow(){if(!raf&&snowRuns()){last=performance.now();raf=requestAnimationFrame(frame)}}
addEventListener("resize",()=>{sizeSnow();syncSnow();kickSnow();clearTimeout(buildGarland.t);buildGarland.t=setTimeout(buildGarland,160)});
addEventListener("pointermove",e=>{if(e.pointerType==="mouse"){mx=e.clientX;my=e.clientY}},{passive:true});
document.documentElement.addEventListener("mouseleave",()=>{mx=my=-999});
document.addEventListener("visibilitychange",kickSnow);

/* ---------- garland ---------- */
const gar=document.createElement("div");gar.id="garland";gar.setAttribute("aria-hidden","true");document.body.appendChild(gar);
function buildGarland(){
  if(!look.anim.garland){gar.innerHTML="";return}
  const w=innerWidth,seg=clamp(w/(w<700?3:7),120,230),n=Math.ceil(w/seg),L=lightsNow();
  let wire="",bulbs="",idx=0;
  for(let i=0;i<n;i++){
    const x0=i*seg,x1=x0+seg,xm=(x0+x1)/2,sag=13;
    wire+=`M${x0} 2Q${xm} ${2+sag*2} ${x1} 2`;
    for(let j=1;j<=3;j++){
      const t=j/4,x=(1-t)*(1-t)*x0+2*(1-t)*t*xm+t*t*x1,y=(1-t)*(1-t)*2+2*(1-t)*t*(2+sag*2)+t*t*2;
      bulbs+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="bulb" style="--c:${L[idx%4]};--dl:-${((idx*.37)%2.2).toFixed(2)}s"><rect x="-1.8" y="-1" width="3.6" height="4" rx="1" fill="#6b6b6b"/><ellipse cx="0" cy="7" rx="3.5" ry="4.8"/></g></g>`;
      idx++;
    }
  }
  gar.innerHTML=`<svg viewBox="0 0 ${w} 34" preserveAspectRatio="none"><path class="wire" d="${wire}"/>${bulbs}</svg>`;
}

/* ---------- springy interactions ---------- */
let leanEl=null;
document.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse")return;
  const el=look.anim.lean&&!isCalm()&&!reduced()?e.target.closest?.(".tilt,.tilt-card"):null;
  if(leanEl&&leanEl!==el){leanEl.style.transition="transform .75s var(--spring)";leanEl.style.transform="";leanEl=null}
  if(!el)return;
  const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,k=look.anim.jelly;
  el.style.transition="transform .12s linear";
  el.style.transform=`perspective(900px) translateY(-4px) rotateX(${(-y*9*k).toFixed(2)}deg) rotateY(${(x*11*k).toFixed(2)}deg)`;
  leanEl=el;
},{passive:true});
const mainEl=()=>document.getElementById("main");
let lastY=scrollY,lastT=performance.now(),skew=0,target=0,bendRaf=0;
function stepBend(){
  skew+=(target-skew)*.2;target*=.86;
  const m=mainEl();if(m)m.style.transform=Math.abs(skew)<.02?"":`skewY(${skew.toFixed(3)}deg)`;
  if(Math.abs(skew)>.02||Math.abs(target)>.02)bendRaf=requestAnimationFrame(stepBend);
  else{bendRaf=0;if(m)m.style.transform=""}
}
addEventListener("scroll",()=>{
  const now=performance.now(),dy=scrollY-lastY,dt=Math.max(8,now-lastT);lastY=scrollY;lastT=now;
  sdy+=dy;kickSnow();
  if(!look.anim.bend||isCalm()||reduced())return;
  target=clamp(-(dy/dt)*.9*look.anim.bend,-1.4*look.anim.bend,1.4*look.anim.bend);
  if(!bendRaf)bendRaf=requestAnimationFrame(stepBend);
},{passive:true});

    await loadData();
  }catch(error){
    $("#splash").classList.add("off");
    $("#main").innerHTML=`<div class="notice boot-error"><p>${esc(errMsg(error))}</p><button type="button" class="btn" onclick="location.reload()">${tri('Қайта жүктеу','Перезагрузить','Reload')}</button></div>`;
    return;
  }
  if(TOKEN){
    try{ ME=(await api("GET","/api/me")).user }
    catch(error){
      if(error.status===401){TOKEN="";localStorage.removeItem("a782-token")}
      else toast(errMsg(error),true);
    }
  }
  render();
  $("#splash").classList.add("off");
})();
