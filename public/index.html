function reelTranslateTo(n){
  const viewport=document.getElementById('reelViewport');
  const card=document.querySelector(`[data-reel-n="${n}"]`);
  if(!viewport||!card)return 0;
  return viewport.clientWidth/2-(card.offsetLeft+card.offsetWidth/2);
}
function positionReel(track,index){
  track.style.transform=`translate3d(${reelTranslateTo(index)}px,0,0)`;
}
function initPrizeReel(){
  const track=document.getElementById('reelTrack');
  if(!track||!D?.prizes?.length||completeReelAnimation)return;
  reelAnchor=REEL_START;
  const selector=`[data-reel-n="${REEL_START}"]`;
  if(REEL_LAST_WIN)track.querySelector(selector).outerHTML=prizeCard(REEL_LAST_WIN,REEL_START);
  track.style.transition='none';
  positionReel(track,reelAnchor);
  track.querySelectorAll('.is-at-rest,.is-selected').forEach(el=>el.classList.remove('is-at-rest','is-selected'));
  track.querySelector(selector)?.classList.add(REEL_LAST_WIN?'is-selected':'is-at-rest');
}
function animateReelTo(prize,previousPrize){
  const track=document.getElementById('reelTrack');
  const machine=document.getElementById('winterReel');
  if(!track||!D?.prizes?.length)return Promise.resolve();
  const startSelector=`[data-reel-n="${REEL_START}"]`;
  const goalSelector=`[data-reel-n="${REEL_GOAL}"]`;
  return new Promise(resolve=>{
    const duration=(!S.motion||D?.appearance?.motion==='off'||window.matchMedia('(prefers-reduced-motion: reduce)').matches)?180:5200;
    if(previousPrize)track.querySelector(startSelector).outerHTML=prizeCard(previousPrize,REEL_START);
    track.querySelector(goalSelector).outerHTML=prizeCard(prize,REEL_GOAL);
    track.querySelectorAll('.is-at-rest,.is-selected').forEach(el=>el.classList.remove('is-at-rest','is-selected'));
    machine?.classList.add('is-spinning');
    track.style.transition='none';
    positionReel(track,REEL_START);
    void track.offsetHeight;
    let done=false;
    let deadline;
    function finish(showResult=true){
      if(done)return;
      done=true;
      clearTimeout(deadline);
      stopReelAudio();
      track.removeEventListener('transitionend',onEnd);
      machine?.classList.remove('is-spinning');
      completeReelAnimation=null;
      if(showResult && track===document.getElementById('reelTrack')){
        track.style.transition='none';
        reelAnchor=REEL_GOAL;
        positionReel(track,reelAnchor);
        track.querySelector(goalSelector)?.classList.add('is-selected');
        if(!document.hidden)playReelWin();
      }
      resolve();
    }
    function onEnd(event){
      if(event.target===track&&event.propertyName==='transform')finish();
    }
    if(document.hidden){finish();return}
    completeReelAnimation=finish;
    track.addEventListener('transitionend',onEnd);
    deadline=setTimeout(finish,duration+300);
    track.style.transition=`transform ${duration}ms cubic-bezier(.10,.77,.11,1)`;
    positionReel(track,REEL_GOAL);
    playReelTicks(duration);
  });
}

async function spin(){
  if(SPIN)return;
  if(ME && TOKEN && D?.prizes?.length)prepareReelAudio();
  if(navigator.locks && ME){
    let callbackStarted=false;
    try{
      await navigator.locks.request('a782-wheel:'+ME.id,{ifAvailable:true},async lock=>{
        callbackStarted=true;
        if(!lock){toast(E[LANG].spin_busy,true);return}
        await performSpin();
      });
      return;
    }catch(error){
      if(callbackStarted){toast(errMsg(error),true);return}
    }
  }
  return performSpin();
}
async function performSpin(){
  if(SPIN)return;
  if(!TOKEN||!ME){toast(t('login'),true);location.hash='#me';return}
  if(!D?.prizes?.length){toast(t('nores'),true);return}
  const session=TOKEN, account=ME.id, pendingKey='a782-spin-pending:'+account;
  SPIN=true;
  try{
    syncSpinButton();
    const announcement=document.getElementById('reelAnnouncement');
    if(announcement)announcement.textContent=tri('Жүлде анықталып жатыр…','Выбираем приз…','Selecting reward…');
    let requestId=localStorage.getItem(pendingKey);
    if(!requestId){
      requestId=crypto.randomUUID?.() || Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(pendingKey,requestId);
    }
    const result=await api('POST','/api/wheel/spin',{requestId});
    if(result?.user?.id!==account || !result.prize)throw Object.assign(new Error('connection_error'),{code:'connection_error'});
    localStorage.removeItem(pendingKey);
    if(session!==TOKEN)return;
    const previousPrize=REEL_LAST_WIN;
    ME=result.user;
    reelReadyAt=Date.now()+(result.cooldownMs||0);
    REEL_LAST_WIN=result.prize;
    await animateReelTo(result.prize,previousPrize);
    if(session!==TOKEN)return;
    updateReelResult();
    toast(L(result.prize.label)+(result.code?` · ${result.code}`:''));
  }catch(error){
    if(error.status && error.status<500 && ![408,429].includes(error.status) && error.code!=='spin_busy')localStorage.removeItem(pendingKey);
    if(session!==TOKEN)return;
    const message=['request_timeout','connection_error'].includes(error.code)
      ? tri('Байланыс үзілді. Қайта басқанда осы айналым тексеріледі.','Связь прервалась. Повторный клик проверит это вращение.','Connection interrupted. Clicking again checks this spin.')
      : errMsg(error);
    const announcement=document.getElementById('reelAnnouncement');
    if(announcement)announcement.textContent=message;
    toast(message,true);
  }finally{
    SPIN=false;
    syncSpinButton();
  }
}

function mcFileSize(bytes){
  if(!bytes)return "";
  return bytes>=1048576?(bytes/1048576).toFixed(1)+" MB":Math.max(1,Math.round(bytes/1024))+" KB";
}
function mcReleaseLabel(row){
  const compatible=row.games?.length?row.games.slice(0,3).join(", "):"";
  return [row.name||row.number||row.id,compatible,row.loaders?.map(k=>MC_LOADER_NAMES[k]||k).join(", ")].filter(Boolean).join(" · ");
}
function mcFileRows(dialog){

    row.downloads?mcDownloadCount(row.downloads):""].filter(Boolean);

    return `<div class="notice mc-file-fallback">

async function loadMCDownload(dialog,page=0){
  dialog.page=page;
  dialog.busy=true;
  dialog.error="";
  dialog.versions=[];
  dialog.release="";
  const revision=openSheet(mcDialogHTML(dialog));
  const params=new URLSearchParams({
    source:dialog.source,id:dialog.id,type:dialog.type,version:dialog.game,loader:dialog.loader,page
  });
  try{
    const data=await api("GET","/api/mc/versions?"+params);
    if(sheetRevision!==revision || dialog!==mcDialog)return;
    dialog.project=data.project||dialog.project;
    dialog.versions=Array.isArray(data.versions)?data.versions:[];
    dialog.pagination=data.pagination;
    dialog.release=dialog.versions[0]?.id||"";
  }catch(error){
    if(sheetRevision!==revision || dialog!==mcDialog)return;
    dialog.error=errMsg(error);
  }
  dialog.busy=false;
  openSheet(mcDialogHTML(dialog));
}
function openVersions(id,title,source=MC.source,type=MC.type){
  if(!Object.hasOwn(MC_SOURCES,source))source="modrinth";
  const inCatalog=ROUTE==="mc"&&source===MC.source;
  const project=inCatalog&&Array.isArray(MC.hits)?MC.hits.find(hit=>hit.id===id):null;
  const supportsLoader=["mod","modpack"].includes(type);
  mcDialog={
    id,title,source,type,project,game:inCatalog?MC.version:"",loader:inCatalog&&supportsLoader?MC.loader:"",
    versions:[],release:"",page:0,pagination:null,busy:false,error:""
  };
  return loadMCDownload(mcDialog);
}

let mcSearchRevision=0;
async function searchMC(page=0){
  const revision=++mcSearchRevision;
  MC.page=page;
  MC.error="";
  if(MC.source==="curseforge"&&!mcEnabled(MC.source)){
    MC.hits=[];
    MC.pagination=null;
    updateMC();
    return;
  }
  MC.hits="loading";
  updateMC();
  const params=new URLSearchParams({
    source:MC.source||"modrinth",q:MC.q,type:MC.type,loader:MC.loader||"",version:MC.version||"",sort:MC.sort||"downloads",page
  });
  try{
    const data=await api("GET","/api/mc/search?"+params);
    if(revision!==mcSearchRevision)return;
    MC.hits=Array.isArray(data.hits)?data.hits:[];
    MC.pagination=data.pagination||null;
  }catch(error){
    if(revision!==mcSearchRevision)return;
    MC.hits="error";
    MC.error=errMsg(error);
    MC.pagination=null;
  }
  updateMC();
}

const ADMIN_ENDPOINT={games:"/api/admin/games",giveaways:"/api/admin/giveaways",products:"/api/admin/products",modpacks:"/api/admin/modpacks"};

// Explicit, mobile-friendly admin add/edit handler.
// Never lets browser-native required-field validation swallow the Save/Add click.
const ADMIN_FORM_KINDS={fGame:"games",fGw:"giveaways",fPr:"products",fMp:"modpacks"};
function adminFormError(form,message,focusName){
  let box=form.querySelector('[data-admin-error]');
  if(!box){box=document.createElement('p');box.dataset.adminError='1';box.setAttribute('role','alert');box.style.cssText='color:var(--bad);font-size:13px;margin-top:6px;white-space:pre-wrap';form.appendChild(box)}
  box.textContent=message;
  const status=form.querySelector('[data-admin-status]');
  if(status){status.textContent=message;status.style.color='var(--bad)'}
  toast(message,true);
  const field=focusName && form.elements.namedItem(focusName);
  if(field&&typeof field.focus==='function')field.focus({preventScroll:false});
}
function clearAdminFormError(form){const box=form.querySelector('[data-admin-error]');if(box)box.remove();const status=form.querySelector('[data-admin-status]');if(status){status.textContent='';status.style.color='var(--mute)'}}
async function submitAdminForm(form){
  if(!form||!ADMIN_FORM_KINDS[form.getAttribute('id')]||form.dataset.submitting==='1')return;
  clearAdminFormError(form);
  const fields=formObj(form), kind=ADMIN_FORM_KINDS[form.getAttribute('id')];
  const hasText=prefix=>['kk','ru','en'].some(lang=>String(fields[prefix+'_'+lang]||'').trim());
  const titleError=tri('Атауын енгіз.','Укажи название.','Enter a title.');
  if(kind==='products'){
    if(!hasText('name'))return adminFormError(form,titleError,'name_kk');
    const price=String(fields.price||'').trim();
    if(price===''||!/^\d+$/.test(price)||Number(price)>10000000){
      return adminFormError(form,tri('Бағаны дұрыс жаз: 0 ₸ немесе одан жоғары бүтін сан.','Укажи цену: целое число от 0 ₸.','Enter a valid whole-number price from 0 ₸.'),'price');
    }
  }else if(kind==='games'){
    if(!String(fields.name||'').trim())return adminFormError(form,titleError,'name');
  }else if(kind==='giveaways'){
    if(!hasText('title'))return adminFormError(form,titleError,'title_kk');
  }else if(kind==='modpacks'){
    if(!String(fields.title||'').trim())return adminFormError(form,titleError,'title');
  }
  const button=form.querySelector('[data-adminsubmit],button[type="submit"]');
  form.dataset.submitting='1';
  if(button)button.disabled=true;
  const originalText=button?button.innerHTML:'';
  if(button)button.textContent=tri('Сақталып жатыр…','Сохраняется…','Saving…');
  const status=form.querySelector('[data-admin-status]');
  if(status){status.textContent=tri('Серверге жіберіліп жатыр…','Отправка на сервер…','Sending to server…');status.style.color='var(--acc)'}
  try{
    if(kind==="games"){
      await waitForImages(form);
      const current=D.games.find(game=>game.id===fields.id);
      for(const name of ["avatar","banner"]){
        fields[name]=selectedAdminImage(form,name,current?.[name]);
        fields[name==="avatar"?"clearAvatar":"clearBanner"]=!fields[name];
      }
    }
    await translatedFields(form,fields);
    await api('POST',ADMIN_ENDPOINT[kind],fields,true);
    await loadData();
    render(true);
    toast(tri('Сәтті қосылды / сақталды ✓','Добавлено / сохранено ✓','Added / saved ✓'));
  }catch(err){
    if(err.code==='admin_required'){
      // Render redeploy/restart clears server-side admin tokens, not sessionStorage.
      // Don't discard what the owner typed; reauthenticate and retry the clicked save.
      pendingAdminSave={id:form.getAttribute('id'),fields:{...fields}};
      clearAdminSession();
      render(true);
      toast(tri('PIN сессиясы аяқталды. Қайта PIN енгіз: тауар жоғалмайды.','Сессия PIN истекла. Введи PIN: данные не потеряются.','PIN session expired. Re-enter PIN; your draft is kept.'),true);
      document.querySelector('#pinForm input[name="pin"]')?.focus();
      return;
    }
    const reason=err.code==='translation_failed'?errMsg(err):err.code==='title_required'?titleError:
      err.code==='admin_required'?tri('Админ сессиясы аяқталған. Қайта кір.','Сессия администратора истекла. Войди снова.','Admin session expired. Sign in again.'):
      err.code==='too_large'?tri('Дерек көлемі тым үлкен.','Слишком большой объём данных.','Payload is too large.'):
      tri('Сақталмады. Сервер жауабы: ','Не сохранено. Ответ сервера: ','Not saved. Server response: ')+(err.code||err.message||'generic')+(err.status?' (HTTP '+err.status+')':'');
    adminFormError(form,reason);
  }finally{
    delete form.dataset.submitting;
    if(form.isConnected&&button){button.disabled=false;button.innerHTML=originalText}
  }
}

const imageJobs=new WeakMap();
async function waitForImages(form){
  const files=Array.from(form.querySelectorAll("input[type=file]")).filter(input=>input.files.length);
  const results=await Promise.all(files.map(input=>imageJobs.get(input)));
  if(results.includes(false))throw Object.assign(new Error("invalid_image_url"),{code:"invalid_image_url"});
}
async function prepareUpload(input,file){
  const form=input.form,recordId=form.elements.namedItem("id")?.value;
  const url=URL.createObjectURL(file),img=new Image();
  try{
    img.src=url;
    await img.decode();
    if(!form.isConnected || input.files[0]!==file || recordId!==form.elements.namedItem("id")?.value)return;
    const max=Number(input.dataset.max)||200;
    const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=canvas.getContext("2d");
    let data;
    while(true){
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      data=canvas.toDataURL("image/webp",.76);
      if(data.length<=60000)break;
      if(Math.max(canvas.width,canvas.height)<=120)throw new Error("invalid_image_url");
      canvas.width=Math.max(1,Math.round(canvas.width*.8));
      canvas.height=Math.max(1,Math.round(canvas.height*.8));
    }
    const target=form.elements[input.dataset.tofield];
    if(input.hasAttribute("data-image-picker")){target.dataset.upload=data;target.value=""}
    else target.value=data;
    const remove=form.elements["clear_"+input.dataset.tofield];
    if(remove)remove.checked=false;
    return true;
  }finally{URL.revokeObjectURL(url)}
}

async function adminBal(spec){

  // A pending click is locked so double-clicking can't subtract twice by accident.

  const [id,field,amount]=spec.split("|");

  if(!/^[a-zA-Z0-9_-]+$/.test(id)||!["tickets","tokens","diamonds"].includes(field)||!Number.isInteger(delta)||delta===0)return;
  busyBalanceActions.add(spec);
  const btn=[...document.querySelectorAll('[data-bal]')].find(b=>b.dataset.bal===spec);
  if(btn)btn.disabled=true;
  try{
    await api("POST",`/api/admin/users/${id}/balance`,{field,delta},true);
    await loadAdmin();
    toast(delta<0?tri('Билет алынды ✓','Билеты списаны ✓','Tickets removed ✓'):tri('Баланс жаңартылды ✓','Баланс обновлён ✓','Balance updated ✓'));
  }catch(e){toast(errMsg(e),true)}
  finally{
    busyBalanceActions.delete(spec);
    if(btn&&btn.isConnected)btn.disabled=false;
  }
}

    if (!en.isIntersecting) return;
    numIO.unobserve(en.target);
    const el = en.target, m = el.textContent.trim().match(/^(\d[\d\s,.]*)(.*)$/);
    if (!m) return;
    const end = parseInt(m[1].replace(/[^\d]/g, ""), 10), tail = m[2];
    if (!end || end > 1e9) return;
    const t0 = performance.now(), dur = 1300;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), v = Math.round(end * (1 - Math.pow(1 - p, 4)));
      el.textContent = v.toLocaleString("en-US").replace(/,/g, " ") + tail;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }), { threshold: .4 });
  function setupNumbers(pg) {
    if (LV < 1) return;
    $$(".stat b, .stat strong, .stat .num", pg).forEach(el => {
      if (el.dataset.fxn || el.children.length) return;
      if (!/^\d[\d\s,.]*\D{0,3}$/.test(el.textContent.trim())) return;
      el.dataset.fxn = "1"; numIO.observe(el);
    });
  }

  /* ---------------------- БЕТ АУЫСУ ЭФФЕКТІСІ ---------------------- */
  const sweep = document.createElement("div"); sweep.id = "fx-sweep";
  document.body.appendChild(sweep);
  function pageEnter(pg) {
    if (LV < 2) return;
    sweep.animate([
      { opacity: 0, backgroundPosition: "100% 0" },
      { opacity: 1, offset: .25 },
      { opacity: 0, backgroundPosition: "0% 0" }
    ], { duration: 750, easing: "cubic-bezier(.4,0,.2,1)" });
    const kids = [...pg.children].filter(k => !k.classList.contains("rv")).slice(0, 10);
    kids.forEach((k, i) => k.animate([
      { opacity: 0, transform: "translateY(26px) scale(.985)", filter: "blur(6px)" },
      { opacity: 1, transform: "none", filter: "blur(0)" }
    ], { duration: 700, delay: 60 + i * 70, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" }));
    $$(".tabbar a.on svg, .dnav a.on svg").forEach(s => s.animate([
      { transform: "scale(1) rotate(0)" }, { transform: "scale(1.35) rotate(-10deg)", offset: .4 },
      { transform: "scale(.92) rotate(4deg)", offset: .7 }, { transform: "scale(1) rotate(0)" }
    ], { duration: 600, easing: "ease-out" }));
  }

  /* ---------------------- #main БАҚЫЛАУ ---------------------- */
  function scan(isEnter) {
    const pg = $("#main .pg") || $("#main");
    if (!pg) return;
    if (isEnter) pageEnter(pg);
    setupHero(pg);
    setupNumbers(pg);
    hideSpot(); tiltCard = null;
    requestAnimationFrame(onScroll);
  }
  let lastPg = null;
  const mo = new MutationObserver(() => {
    const pg = $("#main .pg");
    const fresh = pg && pg !== lastPg;
    lastPg = pg;
    scan(!!(fresh && pg.classList.contains("page-enter")));
  });

  /* ---------------------- ЖАСЫРЫН СЫЙ: "a782" ---------------------- */
  let typed = "";
  addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
    typed = (typed + (e.key || "").toLowerCase()).slice(-4);
    if (typed === "a782" && LV >= 1) snowBurst();
  });
  /* телефонда: логотипті 5 рет жылдам бас */
  let taps = [];
  document.addEventListener("click", e => {
    if (!(e.target.closest && e.target.closest(".brand"))) return;
    const now = Date.now();
    taps = taps.filter(t => now - t < 1500); taps.push(now);
    if (taps.length >= 5 && LV >= 1) { taps = []; snowBurst(); }
  });
  function snowBurst() {
    const cols = [cssVar("--acc", "#fff"), cssVar("--acc3", "#fff"), "#ffffff", cssVar("--acc2", "#fff")];
    for (let i = 0; i < 70; i++) {
      const f = document.createElement("i");
      f.className = "fx-flake"; f.textContent = Math.random() < .5 ? "❄" : "✦";
      f.style.left = rand(0, 100) + "vw"; f.style.fontSize = rand(10, 26) + "px";
      f.style.setProperty("--c", cols[i % cols.length]);
      document.body.appendChild(f);
      f.animate([
        { transform: "translate(0,0) rotate(0)", opacity: 1 },
        { transform: `translate(${rand(-120, 120)}px,${innerHeight + 60}px) rotate(${rand(-360, 360)}deg)`, opacity: .2 }
      ], { duration: rand(1800, 3600), delay: rand(0, 700), easing: "cubic-bezier(.3,.1,.6,1)", fill: "backwards" })
        .onfinish = () => f.remove();
    }
  }

  /* ---------------------- БАПТАУ ӨЗГЕРСЕ ---------------------- */
  function applyLevel() {
    LV = level();
    if (LV >= 2) startStars(); else stopStars();
    if (LV < 2) {
      layers.forEach(([el]) => (el.style.translate = ""));
      layers = []; clearTimeout(heroTimer);
      resetTilt(tiltCard); tiltCard = null;
      if (magEl) { magEl.style.translate = ""; magEl = null; }
    }
    if (LV < 1) hideSpot();
    scan(false);
  }
  new MutationObserver(applyLevel).observe(root, { attributes: true, attributeFilter: ["data-motion", "data-theme", "data-palette"] });
  new MutationObserver(applyLevel).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  mqReduce.addEventListener && mqReduce.addEventListener("change", applyLevel);
  setInterval(() => { if (starsOn) readColors(); }, 2500);

  /* ---------------------------- ІСКЕ ҚОСУ ---------------------------- */
  function boot() {
    const main = $("#main");
    if (main) mo.observe(main, { childList: true });
    lastPg = $("#main .pg");
    placeTopBtn();
    intro();
    applyLevel();
    if (lastPg) pageEnter(lastPg);
    addEventListener("hashchange", () => setTimeout(placeTopBtn, 50));
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
