<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1231">
<title>A782 DIGITAL · Winter Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
/* A782 DIGITAL — cobalt winter. Shared colors, layout and motion. */
:root {
  color-scheme: dark;
  --bg: #0b1231;
  --bg2: #111b40;
  --panel: #182651;
  --raised: #25386b;
  --input: #101a3d;
  --line: #354b82;
  --ink: #f6f8ff;
  --mute: #c1cdf0;
  --acc: #84caff;
  --acc2: #77e6ff;
  --acc3: #bea7ff;
  --ok: #63edc0;
  --bad: #ff9fba;
  --tone-store: #ff9ac5;
  --tone-minecraft: #56e9bd;
  --tone-giveaways: #ffcd6e;
  --tone-premium: #c3a6ff;
  --tone-streams: #76dcff;
  --accent-ink: #101a3c;
  --ambient: #28265d;
  --shadow: 0 18px 55px #05092764;
  --fh: Inter, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2,.72,.25,1);
  --radius: 16px;
  --bottom-bar: 0px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #edf2ff;
  --bg2: #f8faff;
  --panel: #ffffff;
  --raised: #e0e9ff;
  --input: #f0f4ff;
  --line: #bcc9ec;
  --ink: #14234b;
  --mute: #495985;
  --acc: #244dc1;
  --acc2: #076b99;
  --acc3: #6336ae;
  --ok: #06634f;
  --bad: #a41c4a;
  --tone-store: #a52063;
  --tone-minecraft: #08694f;
  --tone-giveaways: #875002;
  --tone-premium: #5c31af;
  --tone-streams: #075b84;
  --ambient: #d9d9ff;
  --shadow: 0 18px 48px #233f8b1a;
}

:root {
  --accent-text: color-mix(in srgb, var(--acc), var(--ink) 14%);
  --accent-fill: linear-gradient(135deg, #a2ecff, #a9b6ff 65%, #c8a7ff);
  --accent-wash: color-mix(in srgb, var(--acc) 17%, var(--panel));
  --button-start: color-mix(in srgb, #334bdb 88%, var(--acc));
  --button-end: color-mix(in srgb, #6830ce 88%, var(--acc3));
  --button-fill: linear-gradient(115deg, var(--button-start), var(--button-end));
  --section-accent: var(--accent-text);
}
:root[data-theme="light"] {
  --accent-text: color-mix(in srgb, var(--acc) 35%, #14234b);
  --accent-wash: color-mix(in srgb, var(--acc) 10%, var(--panel));
}

*, *::before, *::after { box-sizing: border-box; }
html { min-width: 300px; scroll-padding: 22px 0; }
body {
  margin: 0;
  background: radial-gradient(ellipse 76rem 31rem at 76% 0, var(--ambient), transparent 86%), var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--fh);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, figure { margin: 0; }
h1, h2, h3, h4 { line-height: 1.12; letter-spacing: -.035em; text-wrap: balance; }
h1 { font-size: clamp(2.25rem, 5vw, 4.25rem); font-weight: 800; }
h2 { font-size: clamp(1.45rem, 2.8vw, 2.35rem); font-weight: 760; }
h3 { font-size: 1.2rem; font-weight: 740; }
p, a, label, td, dd { overflow-wrap: anywhere; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
img { display: block; max-width: 100%; }
::selection { background: #a9caff; color: #101a3c; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
[hidden] { display: none !important; }
.ic { width: 1.18em; height: 1.18em; vertical-align: -.16em; flex: none; }
.mute { color: var(--mute); }
.sm { font-size: .82rem; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0; }
.between { justify-content: space-between; }
.wide { width: 100%; }
.bl { margin-block-start: 24px; }
:is(h2,h3).bl { margin: 44px 0 17px; }
.lead { color: var(--mute); font-size: clamp(.98rem,1.4vw,1.12rem); max-width: 62ch; }
.eyebrow, .nexus-kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  color: var(--accent-text);
  font: 500 .72rem/1.4 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.eyebrow .ic, .nexus-kicker .ic { font-size: 1rem; }

/* The same navigation becomes a compact header and dock on small screens. */
.site-shell {
  display: grid;
  grid-template-columns: 220px minmax(0,1fr);
  max-width: 1700px;
  margin-inline: auto;
  min-height: 100dvh;
}
.top {
  position: sticky;
  inset-block-start: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 28px;
  padding: 28px 16px 20px;
  background: linear-gradient(175deg, color-mix(in srgb,var(--acc3) 10%,var(--bg2)), var(--bg2) 48%);
  border-inline-end: 1px solid var(--line);
  overflow: auto;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -.035em;
  padding: 4px 4px 16px;
  border-block-end: 1px solid var(--line);
  min-width: 0;
}
#brand { overflow-wrap: anywhere; }
.mark {
  display: grid;
  place-items: center;
  flex: 0 0 37px;
  height: 37px;
  border-radius: 9px 9px 2px 9px;
  color: var(--accent-ink);
  background: var(--accent-fill);
  font-size: 1.2rem;
  font-weight: 900;
}
/* Color identifies each area in the nav, directory, and page header. */
:is([data-r="store"], .home-directory a[href="#store"], .pg[data-page="store"], .card:has([data-add])) {
  --section-accent: var(--tone-store);
}
:is([data-r="minecraft"], .home-directory a[href="#minecraft"], .pg[data-page="minecraft"], .card:has([data-library^="modpack:"])) {
  --section-accent: var(--tone-minecraft);
}
:is([data-r="giveaways"], .home-directory a[href="#giveaways"], .pg[data-page="gw"], .card:has([data-enter],.win)) {
  --section-accent: var(--tone-giveaways);
}
:is([data-r="vip"], .home-directory a[href="#vip"], .pg[data-page="vip"]) {
  --section-accent: var(--tone-premium);
}
:is([data-r="streams"], .pg[data-page="streams"], .home-stream) {
  --section-accent: var(--tone-streams);
}

.dnav { display: grid; gap: 5px; }
.dnav a {
  display: flex;
  gap: 11px;
  align-items: center;
  padding: 11px 12px;
  min-height: 44px;
  color: var(--mute);
  font-size: .89rem;
  font-weight: 620;
  border: 1px solid transparent;
  border-radius: 9px;
  transition: color .2s, background .2s, border-color .2s;
}
.dnav a .ic { font-size: 1.05rem; }
.dnav a:hover { background: var(--raised); color: var(--ink); }
.dnav a.on {
  color: var(--section-accent);
  background: color-mix(in srgb,var(--section-accent) 16%,var(--bg2));
  border-color: color-mix(in srgb,var(--section-accent) 40%,var(--line));
  box-shadow: inset 3px 0 var(--section-accent);
}
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: auto; min-width: 0; }
#gear { display: inline-flex; align-items: center; gap: 5px; }
.nav-vip-marker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 9px;
  min-height: 36px;
  padding: 0 8px;
  color: var(--accent-text);
  font: 600 .72rem var(--mono);
}
.tabbar { display: none; }
main { width: 100%; min-width: 0; padding: 30px clamp(22px,3vw,52px) 20px; }
.pg { --dir: 1; max-width: 1260px; min-width: 0; margin-inline: auto; }
.pg.page-enter > :first-child { animation: page-enter .34s var(--ease) both; }
@keyframes page-enter { from { opacity: .55; translate: calc(var(--dir) * 6px) 8px; } to { opacity: 1; translate: 0 0; } }
.page-enter:not([data-page="admin"]) .rv.in { animation: reveal .52s var(--ease) both; animation-delay: min(var(--d, 0ms), 180ms); }
@keyframes reveal { from { opacity: .55; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }

/* Home composition. */
.hero { display: grid; grid-template-columns: minmax(0, .94fr) minmax(0, 1.06fr); min-height: 485px; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: #1c2b6a; color: #f7faff; box-shadow: var(--shadow); }
.hero-copy { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 20px; padding: clamp(26px,4vw,55px);
  background:
    radial-gradient(ellipse at 3% 4%, #4f48ba 0%, transparent 67%),
    linear-gradient(135deg, #202364 18%, #223a8c 70%, #2d2979);
}
.hero-copy h1 { font-size: clamp(2.25rem, 3.7vw, 4.15rem); line-height: 1.02; letter-spacing: -.07em; text-wrap: pretty; }
.hero-copy .lead { max-width: 38ch; color: #d8e4ff; }
.hero-copy .eyebrow { color: #98ecff; }
.hero :focus-visible { outline-color: #beecff; }
.hero-actions .btn:not(.ghost) { background: linear-gradient(120deg, #8ae9ff, #a6beff); color: #101a3c; border-color: #d1edff; }
.hero-actions .btn.ghost { background: #18295e; color: #f4f7ff; border-color: #7188d5; }
.hero-actions { gap: 8px; margin-top: 4px; }
.hero-image { min-height: 280px; position: relative; overflow: hidden; isolation: isolate; background: #4166b0; }
.hero-image::before, .hero-image::after { content: ""; position: absolute; inset: 0; }
.hero-image::before { background: var(--hero-image, linear-gradient(150deg,#7ea3ff,#2c286d)) center center/cover; animation: alpine-photo 1.2s var(--ease) both; }
.hero-image::after { background:
  radial-gradient(ellipse at 92% 12%, #9d55ec55, transparent 68%),
  linear-gradient(125deg,#244ab67a,transparent 46%,#283a9d65); pointer-events: none; }
@keyframes alpine-photo { from { scale: 1.065; opacity: .58; } to { scale: 1; opacity: 1; } }
.snow-drift { position: absolute; z-index: 1; inset: 0; overflow: hidden; pointer-events: none; }
.snow-drift i {
  position: absolute;
  left: var(--left);
  top: var(--top);
  width: var(--size, 3px);
  height: var(--size, 3px);
  border-radius: 50%;
  background: #f8fff9;
  box-shadow: 0 0 8px #f8fff9;
  opacity: .65;
  animation: drift var(--time, 8s) ease-in-out var(--delay,0s) infinite alternate;
}
@keyframes drift { to { opacity: .18; transform: translate(-28px,45px); } }
.home-directory {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 10px;
  margin-block: 16px 24px;
}
.home-directory > a {
  position: relative;
  display: grid;
  align-content: start;
  justify-items: start;
  gap: 8px;
  padding: 16px;
  border: 1px solid color-mix(in srgb,var(--section-accent) 42%,var(--line));
  border-radius: 13px;
  background: linear-gradient(150deg, color-mix(in srgb,var(--section-accent) 24%,var(--panel)), var(--panel) 79%);
  min-height: 126px;
  transition: background .25s,border-color .25s,transform .28s var(--ease);
}
.home-directory > a:hover {
  border-color: var(--section-accent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb,var(--section-accent) 40%,transparent);
}
.home-directory > a .directory-icon {
  color: var(--accent-ink);
  background: var(--section-accent);
  border-color: color-mix(in srgb,var(--section-accent) 58%,#fff);
}
:root[data-theme="light"] .home-directory > a {
  background: linear-gradient(150deg,color-mix(in srgb,var(--section-accent) 13%,#fff),#fff 85%);
}
:root[data-theme="light"] .home-directory > a .directory-icon {
  color: var(--section-accent);
  background: color-mix(in srgb,var(--section-accent) 12%,#fff);
}
.directory-icon, .ibox, .library-icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex: none;
  color: var(--accent-text);
  background: var(--accent-wash);
  border: 1px solid color-mix(in srgb,var(--acc) 24%,var(--line));
  border-radius: 9px;
}
.directory-icon .ic, .ibox .ic, .library-icon .ic { width: 18px; height: 18px; }
.home-directory small { font-size: .78rem; color: var(--mute); line-height: 1.4; }
.directory-arrow { position: absolute; inset: 17px 16px auto auto; color: var(--mute); transition: transform .25s; }
.home-directory > a:hover .directory-arrow { transform: translateX(3px); color: var(--section-accent); }
.stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
.stat.glass { display: grid; gap: 4px; background: transparent; border: 0; border-block-start: 1px solid var(--line); border-radius: 0; padding: 12px 4px; }
.stat:nth-child(1) { --section-accent: var(--tone-giveaways); }
.stat:nth-child(2) { --section-accent: var(--tone-minecraft); }
.stat:nth-child(3) { --section-accent: var(--tone-streams); }
.stat.glass { border-block-start-color: color-mix(in srgb,var(--section-accent) 50%,var(--line)); }
.stat b { color: var(--section-accent); font: 600 clamp(1.18rem,2.5vw,2rem)/1.2 var(--mono); }
.stat span { color: var(--mute); font-size: .79rem; }
.home-stream { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-block: 22px; }
.home-stream-title { flex: 1 1 150px; }
.home-stream-title small { display: block; color: var(--mute); }
.home-stream > .ic { color: var(--section-accent); }
.home-stream { border-color: color-mix(in srgb,var(--section-accent) 35%,var(--line)); }
.home-section { margin-top: 44px; }
.section-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
.section-link { color: var(--accent-text); font-size: .86rem; font-weight: 650; }
.section-link:hover { text-decoration: underline; text-underline-offset: 4px; }
.home-contact { margin-top: 36px; }
.home-contact p { max-width: 68ch; }
.home-contact h2 { margin: 10px 0; }

/* Shared page headers, cards, and controls. */
.ph {
  display: grid;
  justify-items: start;
  align-content: center;
  gap: 12px;
  min-height: 190px;
  padding: 18px 0 24px;
  margin: 0 0 24px;
  border-block-end: 1px solid var(--line);
  background: radial-gradient(ellipse at 85% 22%,color-mix(in srgb,var(--acc) 8%,transparent),transparent 58%);
}

.pg:is([data-page="store"],[data-page="minecraft"],[data-page="gw"],[data-page="streams"]) .ph {
  padding-inline: clamp(15px,3vw,32px);
  border: 1px solid color-mix(in srgb,var(--section-accent) 38%,var(--line));
  border-radius: 16px;
  background:
    repeating-linear-gradient(120deg,transparent 0 31px,color-mix(in srgb,var(--section-accent) 12%,transparent) 31px 32px),
    linear-gradient(105deg,var(--panel) 42%,color-mix(in srgb,var(--section-accent) 24%,var(--panel)));
}
.ph .eyebrow { color: var(--section-accent); }
:root[data-theme="light"] .pg:is([data-page="store"],[data-page="minecraft"],[data-page="gw"],[data-page="streams"]) .ph {
  background: linear-gradient(105deg,var(--panel) 38%,color-mix(in srgb,var(--section-accent) 14%,var(--panel)));
}
.ph h1 { max-width: 24ch; overflow-wrap: anywhere; }
.ph > .row { margin-top: 4px; }
.glass {
  min-width: 0;
  padding: clamp(16px,2.2vw,25px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.glass > :is(h2,h3) + :is(p,form,div,details) { margin-top: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,235px),1fr)); gap: 13px; }
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 13px;
  min-width: 0;
  min-height: 164px;
  transition: transform .32s var(--ease),border-color .28s,box-shadow .28s;
  background: linear-gradient(145deg,color-mix(in srgb,var(--section-accent) 8%,var(--panel)),var(--panel) 66%);
  border-color: color-mix(in srgb,var(--section-accent) 23%,var(--line));
}

.catalog-art {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 86px;
  border: 1px solid color-mix(in srgb,var(--section-accent) 50%,var(--line));
  border-radius: 9px;
  background:
    repeating-linear-gradient(135deg,transparent 0 19px,color-mix(in srgb,var(--section-accent) 16%,transparent) 19px 20px),
    linear-gradient(125deg,var(--input),color-mix(in srgb,var(--section-accent) 35%,var(--panel)));
  color: var(--section-accent);
}
:root[data-theme="light"] .catalog-art {
  background: linear-gradient(125deg,var(--input),color-mix(in srgb,var(--section-accent) 18%,var(--panel)));
}
.catalog-art .ic {
  width: 49px;
  height: 49px;
  padding: 9px;
  border: 1px solid color-mix(in srgb,var(--section-accent) 49%,var(--line));
  border-radius: 11px;
  background: color-mix(in srgb,var(--section-accent) 10%,var(--bg2));
  transition: transform .35s var(--ease);
}
.card-price { font: 750 1.15rem var(--fh); color: var(--section-accent); }
.card h3 { overflow-wrap: anywhere; }
.card > p { font-size: .88rem; }
.card .foot {
  margin-top: auto;
  padding-top: 11px;
  border-block-start: 1px solid var(--line);
  color: var(--mute);
  font-size: .8rem;
}
.card .specs { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--mute); font: 500 .74rem/1.5 var(--mono); }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  width: fit-content;
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg2);
  color: var(--mute);
  font-size: .73rem;
  font-weight: 650;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.tag b { color: var(--ink); }
.tag.a { background: var(--accent-wash); color: var(--accent-text); }
.card :is(.tag.a,.ibox) { background: color-mix(in srgb,var(--section-accent) 13%,var(--panel)); color: var(--section-accent); }
.tag.g { color: var(--ok); border-color: color-mix(in srgb,var(--ok) 33%,var(--line)); }
.win { display: flex; align-items: center; gap: 8px; color: var(--ok); font-size: .86rem; }
.notice, .empty {
  display: block;
  grid-column: 1 / -1;
  padding: 15px 18px;
  color: var(--mute);
  border: 1px dashed var(--line);
  background: var(--bg2);
  border-radius: 11px;
}
.dot { display: inline-block; width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--mute); }
.dot.on { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent); }
.btn, .icon-btn, .ibtn, .nexus-member-open, .nexus-desk-edit, .nexus-tier-preview {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  min-height: 43px;
  min-width: 0;
  max-width: 100%;
  padding: 9px 14px;
  border: 1px solid #8c93f4a8;
  border-radius: 9px;
  color: #fff;
  background: var(--button-fill);
  font-size: .86rem;
  font-weight: 720;
  line-height: 1.3;
  text-align: center;
  overflow: hidden;
  transition: translate .2s var(--ease), background .2s, filter .2s, border-color .2s, box-shadow .2s;
}
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: .78rem; }
.btn.ghost, .icon-btn, .ibtn, .nexus-tier-preview, .nexus-desk-edit {
  color: var(--ink);
  background: var(--bg2);
  border-color: var(--line);
}
.btn.red {
  color: var(--bad);
  background: color-mix(in srgb,var(--bad) 9%,var(--panel));
  border-color: color-mix(in srgb,var(--bad) 35%,var(--line));
}
.icon-btn, .ibtn { width: 37px; height: 37px; min-height: 37px; flex: none; padding: 0; }
.icon-btn .ic, .ibtn .ic { width: 17px; height: 17px; }
.ibtn.on, .lib-toggle.is-saved { color: var(--accent-text); border-color: var(--accent-text); background: var(--accent-wash); }
.btn:hover:not(:disabled), .nexus-member-open:hover { filter: brightness(1.07); translate: 0 -2px; }
.btn:active:not(:disabled), .icon-btn:active { translate: 0 1px; }
.btn:disabled, button[aria-disabled="true"] { opacity: .57; }
.icon-btn:hover, .nexus-tier-preview:hover, .nexus-desk-edit:hover { background: var(--raised); }
.rip { position: absolute; width: 12px; height: 12px; margin: -6px; background: currentColor; opacity: .16; border-radius: 50%; pointer-events: none; animation: ripple .52s ease-out both; }
@keyframes ripple { to { opacity: 0; scale: 14; } }
.seg, .pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg button, .pill {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  min-height: 34px;
  color: var(--mute);
  background: var(--bg2);
  font-size: .8rem;
  font-weight: 660;
  transition: background .2s,border-color .2s,color .2s;
}
.seg button.on, .pill.on { color: var(--accent-text); background: var(--accent-wash); border-color: color-mix(in srgb,var(--acc) 55%,var(--line)); }
.seg button:hover, .pill:hover { border-color: var(--accent-text); color: var(--ink); }
#lang { gap: 3px; }
#lang button { padding: 4px 6px; min-width: 29px; min-height: 30px; font: 600 .69rem var(--mono); }
.pills { margin: 0 0 15px; }
footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 48px; padding: 20px 0 14px; border-top: 1px solid var(--line); color: var(--mute); font-size: .78rem; }
footer .links { display: flex; flex-wrap: wrap; gap: 8px 16px; }
footer a:hover { color: var(--accent-text); }

/* Catalog search, forms, administration, and profile. */
.form { display: grid; grid-template-columns: minmax(0,1fr); gap: 12px; min-width: 0; }
.form > :is(.btn,.seg) { justify-self: start; }
.form > .btn.wide { justify-self: stretch; }
.g2, .g3 { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.g3 { grid-template-columns: repeat(3,minmax(0,1fr)); }
.field { display: grid; grid-template-columns: minmax(0,1fr); gap: 6px; min-width: 0; color: var(--mute); font-size: .82rem; font-weight: 620; }
input:not([type="checkbox"],[type="radio"],[type="hidden"]), textarea, select {
  min-width: 0;
  width: 100%;
  min-height: 43px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--input);
  color: var(--ink);
  font-size: 1rem;
}
input[type="file"] { display: block; padding: 7px 9px; overflow: hidden; text-overflow: ellipsis; }
input::-webkit-date-and-time-value { min-width: 0; text-align: start; }
:is(input,select,textarea) { max-width: 100%; }
input::file-selector-button { color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; margin-inline-end: 8px; }
input:is([type="checkbox"],[type="radio"]) { accent-color: var(--acc); width: 17px; height: 17px; flex: none; margin: 0; }
textarea { display: block; resize: vertical; }
::placeholder { color: var(--mute); opacity: .8; }
fieldset { min-width: 0; }
summary { color: var(--accent-text); cursor: pointer; overflow-wrap: anywhere; }
details > form { margin-top: 15px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 8px 7px 13px; margin-bottom: 13px; }
.search > .ic { color: var(--accent-text); }
.search input { flex: 1; border-color: transparent; background: transparent; }
.filters { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px; margin-bottom: 16px; }
.mr-list, .library-list { display: grid; gap: 7px; }
.mr, .library-item { display: grid; align-items: center; grid-template-columns: 41px minmax(0,1fr) auto; gap: 11px; padding: 12px; }
.mr[data-pid] { cursor: pointer; }
.mr:hover { border-color: var(--accent-text); }
.mr img { width: 41px; height: 41px; object-fit: cover; border-radius: 8px; background: var(--raised); }
.mr-i p { color: var(--mute); font-size: .79rem; }
.mr-i b, .library-item b { overflow-wrap: anywhere; }
.library-item { grid-template-columns: 36px minmax(0,1fr) auto auto; border: 1px solid var(--line); background: var(--bg2); border-radius: 10px; }
.library-item small { display: block; color: var(--mute); }
.ipbox { margin: 12px 0; font: 600 1rem/1.4 var(--mono); color: var(--accent-text); overflow-wrap: anywhere; }
.cd { display: flex; flex-wrap: wrap; gap: 6px; }
.cd > div { display: grid; gap: 3px; justify-items: center; min-width: 49px; padding: 6px 7px; background: var(--input); border: 1px solid var(--line); border-radius: 7px; }
.cd b { font: 600 1.04rem/1.15 var(--mono); }
.cd span { color: var(--mute); font-size: .65rem; }
.cart-bar {
  position: sticky;
  bottom: calc(var(--bottom-bar) + 12px);
  z-index: 9;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  margin-top: 18px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.table { max-width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 0; }
table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: left; border-block-end: 1px solid var(--line); vertical-align: top; }
th { color: var(--mute); background: var(--input); font-weight: 640; }
tr:last-child td { border-block-end: 0; }
td code { font: .78rem var(--mono); overflow-wrap: anywhere; }
.ex, .ex-row, .line, .total, .set {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  min-width: 0;
}
.ex { margin-top: 8px; }
.ex-row, .line, .total { padding: 12px 0; border-block-end: 1px solid var(--line); }
.total { font-weight: 750; }
.qty { display: inline-flex; gap: 8px; align-items: center; }
.qty button { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); }
.chance-row { display: grid; grid-template-columns: minmax(70px,1fr) minmax(74px,110px) minmax(93px,136px); align-items: center; gap: 8px; padding-block: 9px; border-block-end: 1px solid var(--line); }
.chance-row label { font-size: .85rem; }
#chancesTotal { margin: 12px 0 8px; font: 600 .85rem var(--mono); }
#chanceError { color: var(--bad); }
.auth { width: min(100%,465px); }
.icons { display: flex; gap: 6px; flex-wrap: wrap; }
.prof-banner {
  min-height: 160px;
  padding: 17px clamp(15px,2.5vw,24px) 42px;
  color: #f1f5eb;
  background: linear-gradient(100deg,#151d56bf,#25377b60),var(--profile-art, linear-gradient(135deg,#647ce2,#29275d)) center/cover no-repeat;
}
.prof-top { display: flex; position: relative; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 0 22px 14px; margin-top: -30px; }
.avatar-shell { position: relative; flex: none; padding: 4px; background: var(--panel); border-radius: 15px; }
.avatar, .nexus-preview-avatar { width: 70px; height: 70px; display: grid; place-items: center; overflow: hidden; border-radius: 12px; background: var(--raised); color: var(--accent-text); }
.avatar img, .nexus-preview-avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .ic, .nexus-preview-avatar .ic { width: 30px; height: 30px; }
.avatar-shell-vip { border: 1px solid var(--vip-accent); }
.avatar-crown { position: absolute; inset: auto -5px -5px auto; display: grid; place-items: center; width: 23px; height: 23px; background: var(--vip-accent); color: #14214b; border-radius: 6px; }
.profile-rank, .profile-custom-status { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--line); padding: 5px 9px; font-size: .79rem; border-radius: 7px; }
.profile-rank { border-color: color-mix(in srgb,var(--rank) 60%,var(--line)); }
.prof-banner-vip-top, .vip-identity-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .78rem; }
.prof-banner-huge { margin-top: 10px; font-size: clamp(2rem,5vw,3.8rem); font-weight: 850; letter-spacing: -.05em; color: #e8f1ff; }
.vip-identity-title { padding: 0 22px 14px; }
.vip-identity-title small { color: var(--mute); }
.switch { display: inline-flex; align-items: center; position: relative; cursor: pointer; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.switch span { display: block; width: 43px; height: 25px; border-radius: 20px; background: var(--input); border: 1px solid var(--line); }
.switch span::before { content: ""; display: block; width: 17px; height: 17px; margin: 3px; border-radius: 50%; background: var(--mute); transition: transform .22s; }
.switch input:checked + span { background: var(--accent-fill); }
.switch input:checked + span::before { transform: translateX(18px); background: var(--accent-ink); }
.switch input:focus-visible + span { outline: 2px solid var(--accent-text); outline-offset: 3px; }

/* Ticket gallery. Track positioning is the reference for the existing reel math. */
.reel-panel {
  --ticket-width: clamp(123px,15vw,162px);
  min-width: 0;
  padding: clamp(14px,2.2vw,24px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 19px;
  box-shadow: var(--shadow);
}
.reel-head { display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 16px; }
.reel-head p { color: var(--mute); margin-top: 6px; font-size: .9rem; }
.reel-counter {
  display: inline-grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  color: var(--tone-giveaways);
  background: color-mix(in srgb,var(--tone-giveaways) 14%,var(--panel));
  border: 1px solid color-mix(in srgb,var(--tone-giveaways) 42%,var(--line));
  border-radius: 9px;
  font-size: .8rem;
}
.reel-counter strong { font: 600 1.3rem var(--mono); }
.reel-machine {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 23px 0;
  border: 1px solid #596fbb;
  border-radius: 11px;
  background:
    repeating-linear-gradient(90deg,transparent 0 23px,#a6b9ff18 23px 24px),
    linear-gradient(180deg,#283e86,#101a40 59%,#37296d);
}
.reel-viewport { overflow: hidden; min-width: 0; position: relative; }
.reel-viewport::after {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg,#0b143da8,transparent 12%,transparent 88%,#0b143da8);
}
.reel-track { position: relative; display: flex; gap: 11px; align-items: stretch; width: max-content; }
.reel-machine.is-spinning .reel-track { will-change: transform; }
:is(.reel-prize,.rarity-key > li) { --rarity: #a8bdf4; }
:is(.reel-prize,.rarity-key > li)[data-rarity="Rare"] { --rarity: #5ed6ff; }
:is(.reel-prize,.rarity-key > li)[data-rarity="Epic"] { --rarity: #bc94ff; }
:is(.reel-prize,.rarity-key > li)[data-rarity="Legendary"] { --rarity: #ffbf54; }
:is(.reel-prize,.rarity-key > li)[data-rarity="Mythic"] { --rarity: #ff86c0; }
.reel-prize {
  position: relative;
  display: grid;
  grid-template-rows: 38px 1fr auto;
  gap: 6px;
  width: var(--ticket-width);
  min-height: 140px;
  flex: none;
  padding: 11px 11px 8px;
  border: 2px solid color-mix(in srgb,var(--rarity) 66%,#fff);
  border-radius: 10px;
  color: #121a37;
  background: linear-gradient(155deg,color-mix(in srgb,var(--rarity) 62%,#fff),var(--rarity) 78%);
}
.reel-prize[data-rarity="Mythic"] { border-style: double; border-width: 4px; padding: 9px 9px 6px; }
.reel-prize-icon { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid #2e3d7e56; border-radius: 7px; color: #192653; background: #ffffff7d; }
.reel-prize-icon .ic { width: 21px; height: 21px; }
.reel-prize b { line-height: 1.25; font-size: .9rem; overflow-wrap: anywhere; align-self: center; }
.reel-prize small { font: 600 .66rem/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding-top: 7px; border-top: 1px dashed #263b796e; color: #253055; }
.selection-window {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  inset: 12px auto 12px 50%;
  width: calc(var(--ticket-width) + 13px);
  transform: translateX(-50%);
  border: 1px solid #ffe0a6c7;
  border-radius: 13px;
  box-shadow: inset 0 0 19px #ffe0a619,0 0 16px #0a113e8a;
}
.selection-window::before, .selection-window::after { content: ""; position: absolute; inset-inline-start: calc(50% - 12px); width: 24px; height: 4px; background: #ffda89; border-radius: 2px; }
.selection-window::before { top: -2px; }
.selection-window::after { bottom: -2px; }
.reel-prize.is-selected {
  box-shadow: inset 0 0 0 2px #fcfff792, 0 0 18px color-mix(in srgb,var(--rarity) 50%,transparent);
  animation: prize-arrive .52s var(--ease) both;
}
@keyframes prize-arrive { from { scale: .97; filter: brightness(1.26); } to { scale: 1; filter: none; } }
.reel-empty { padding: 18px; color: #e2ebff; }
.reel-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 16px; }
.reel-price-note { margin-inline-end: auto; color: var(--mute); display: inline-flex; align-items: center; gap: 7px; font-size: .83rem; }
.reel-spin-btn {
  min-width: min(100%,160px);
  color: #191a3c;
  background: linear-gradient(115deg,#ffe09b,#ffb759);
  border-color: #ffe4b0;
}
.reel-spin-btn.is-busy { opacity: .65; }
.reel-rules { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
.rarity-key { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 11px; padding: 0; margin: 0; }
.rarity-key > li { color: var(--mute); display: inline-flex; align-items: center; gap: 5px; font: 500 .67rem var(--mono); }
.rarity-key > li::before { content: ""; width: 7px; height: 7px; background: var(--rarity); border-radius: 2px; }
:root[data-theme="light"] .rarity-key > li::before { outline: 1px solid #51628a; }
.reel-announcement { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 42px; padding: 8px 11px; margin-top: 12px; color: var(--mute); background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; font-size: .85rem; }
.reel-announcement b, .reel-announcement .ic { color: var(--accent-text); }
.odds-table { margin-block: 14px; }
.odds-table td, .odds-table th { padding: 8px; }
.reel-wallet { margin-top: 15px; }

/* Premium keeps its controls, tier colors and live preview. */
.nexus-landing, .nexus-member, .nexus-studio, .nexus-desk, .nexus-why {
  --premium-border: color-mix(in srgb,var(--vip-accent,#a9c6ff) 27%,var(--line));
  min-width: 0;
  padding: clamp(16px,3.4vw,38px);
  background: linear-gradient(130deg,var(--panel),var(--bg2));
  border: 1px solid var(--premium-border);
  border-radius: 18px;
}
.nexus-landing {
  display: grid;
  grid-template-columns: minmax(0,1.28fr) minmax(0,.72fr);
  align-items: center;
  gap: clamp(18px,4vw,56px);
  background: radial-gradient(ellipse at 98% 8%,color-mix(in srgb,var(--tone-premium) 31%,var(--panel)),var(--panel) 68%);
}
:root[data-theme="light"] .nexus-landing {
  background: radial-gradient(ellipse at 98% 8%,#e9ddff,var(--panel) 72%);
}
.nexus-landing-copy h1 { font-size: clamp(2rem,5vw,4.6rem); overflow-wrap: anywhere; margin: 10px 0 14px; }
.nexus-landing-copy h1 em { font-size: .58em; color: var(--tone-premium); font-style: normal; letter-spacing: -.04em; }
.nexus-landing-copy p, .nexus-section-heading p, .nexus-studio-intro p { color: var(--mute); max-width: 58ch; }
.nexus-landing-actions, .studio-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 15px; }
.nexus-simple-link { color: var(--accent-text); font-size: .85rem; font-weight: 650; padding: 7px; }
.nexus-benefits { min-width: 0; background: var(--input); border: 1px solid var(--line); padding: 14px; border-radius: 13px; }
.nexus-benefits-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--accent-text); margin-bottom: 6px; }
.nexus-benefits-head small { color: var(--mute); }
.nexus-benefit { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 8px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.nexus-benefit > span { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 7px; color: var(--accent-text); background: var(--accent-wash); }
.nexus-benefit b, .nexus-benefit small { display: block; overflow-wrap: anywhere; }
.nexus-benefit small { color: var(--mute); font-size: .74rem; }
.nexus-levels { margin-block: 35px; }
.nexus-section-heading { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 18px; }
.nexus-section-heading h2, .nexus-studio-intro h2 { margin-top: 5px; }
.nexus-section-heading p { font-size: .85rem; }
.nexus-tier-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; }
.nexus-tier {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 12px;
  border: 1px solid color-mix(in srgb,var(--nexus-tier) 30%,var(--line));
  border-radius: 13px;
  background: var(--panel);
  transition: transform .35s var(--ease), box-shadow .3s;
}
.nexus-tier-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; color: var(--mute); font: 500 .62rem/1.4 var(--mono); }
.nexus-tier-pass, .nexus-pass {
  position: relative;
  display: grid;
  align-content: space-between;
  min-height: 148px;
  gap: 7px;
  padding: 13px;
  color: #16244d;
  border: 1px solid #ffffff78;
  border-radius: 10px;
  background:
    repeating-linear-gradient(130deg,transparent 0 14px,#ffffff33 14px 15px),
    linear-gradient(135deg,#eef2ff,var(--nexus-tier,var(--vip-accent,#a9c6ff)));
  box-shadow: inset 0 -2px #29377326;
}
.nexus-tier-pass-a, .nexus-tier-pass-bottom, .nexus-pass-top, .nexus-pass-bottom { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px; font: 600 .62rem/1.3 var(--mono); }
.nexus-tier-pass-icon .ic, .nexus-pass-symbol .ic { width: 28px; height: 28px; }
.nexus-tier-pass-name { font: 800 clamp(1.05rem,2.2vw,1.7rem)/1 var(--fh); letter-spacing: -.04em; }
.nexus-tier-body { min-width: 0; display: flex; flex-direction: column; flex: 1; gap: 11px; }
.nexus-tier-name { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.nexus-tier-name small { color: var(--mute); font: .69rem var(--mono); }
.nexus-tier-name h3, .nexus-tier-price { overflow-wrap: anywhere; }
.nexus-tier-description { color: var(--mute); font-size: .8rem; }
.nexus-tier-price { font-weight: 750; }
.nexus-tier-price small { color: var(--mute); font-weight: 500; }
.nexus-tier-features { display: grid; gap: 5px; padding-block: 8px; border-block: 1px solid var(--line); color: var(--mute); font-size: .77rem; }
.nexus-tier-features .ic { color: var(--accent-text); }
.nexus-tier-buttons { display: grid; gap: 6px; margin-top: auto; }
.nexus-tier-buttons :is(.btn,button) { font-size: .78rem; }
.nexus-tier-buy { color: #131b39; background: color-mix(in srgb,var(--nexus-tier),#f1f5ff 21%); }
.nexus-levels-footnote { color: var(--mute); font-size: .8rem; margin-top: 13px; }
.nexus-why-items { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-top: 13px; }
.nexus-why-items > div { display: grid; gap: 7px; padding: 12px; background: var(--input); border: 1px solid var(--line); border-radius: 9px; }
.nexus-why-items .ic { color: var(--accent-text); }
.nexus-why-items small { color: var(--mute); }
.nexus-member, .nexus-studio, .nexus-desk { margin-block: 20px; }
.nexus-member-header, .nexus-member-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--mute); font: 500 .7rem/1.4 var(--mono); }
.nexus-member-header { padding-bottom: 13px; border-bottom: 1px solid var(--line); }
.nexus-member-footer { padding-top: 13px; border-top: 1px solid var(--line); }
.nexus-live { color: var(--accent-text); }
.nexus-member-body { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,.8fr); align-items: center; gap: 20px; margin-block: 19px; }
.nexus-member-info { display: grid; justify-items: start; gap: 9px; min-width: 0; }
.nexus-micro, .nexus-verified { font: 500 .67rem var(--mono); color: var(--mute); }
.nexus-member-title { font-size: clamp(2rem,4vw,3.7rem); }
.nexus-member-title span { display: block; font: 600 .7rem/1.4 var(--mono); letter-spacing: .04em; margin-top: 5px; color: var(--accent-text); }
.nexus-member-user, .nexus-member-expiry { font-size: .83rem; }
.nexus-member-description { color: var(--mute); max-width: 50ch; }
.nexus-member-stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; width: 100%; max-width: 430px; }
.nexus-member-stats span { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--input); }
.nexus-member-stats strong { display: block; font: 600 1.1rem var(--mono); }
.nexus-member-stats small { display: block; color: var(--mute); font-size: .7rem; overflow-wrap: anywhere; }
.nexus-member-art { display: grid; place-items: center; min-width: 0; padding: 10px; }
.nexus-pass { width: min(100%,318px); min-height: 172px; box-shadow: 0 14px 32px #09181148; transition: transform .35s var(--ease); }
.nexus-pass-bottom b { font-size: 1.15rem; }
.nexus-studio { scroll-margin-top: 18px; }
.nexus-studio.studio-focused { box-shadow: 0 0 0 2px var(--accent-text); }
.nexus-studio-intro p { margin-top: 7px; }
.nexus-studio-grid { display: grid; grid-template-columns: minmax(0,.75fr) minmax(0,1.25fr); gap: 15px; margin-top: 17px; }
.nexus-studio-preview { display: grid; align-content: center; gap: 12px; min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--input); }
.nexus-preview-label, .nexus-preview-tip { font-size: .74rem; color: var(--mute); }
.nexus-preview-card {
  display: grid;
  gap: 9px;
  min-width: 0;
  padding: 15px;
  border: 1px solid var(--preview-color,#a9c6ff);
  border-radius: 10px;
  color: #16244d;
  background: linear-gradient(135deg,#f3f7ee,var(--preview-color-2,#a9c6ff));
  transition: background .25s,border-color .25s;
}
.nexus-preview-card .nexus-preview-avatar { background: #ffffff74; color: #16244d; }
.nexus-preview-card b { overflow-wrap: anywhere; font-size: 1.18rem; }
.nexus-preview-top, .nexus-preview-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 7px; font: 600 .63rem var(--mono); }
.nexus-preview-status { width: fit-content; background: #ffffff62; padding: 3px 7px; border-radius: 5px; font-size: .75rem; overflow-wrap: anywhere; }
.nexus-preview-card p { font-size: .8rem; }
.nexus-studio-form { min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.nexus-field-title { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.nexus-field-title span, .nexus-field-title small { font: 500 .71rem var(--mono); color: var(--accent-text); }
.studio-colors { display: flex; flex-wrap: wrap; gap: 5px; }
.studio-colors label { position: relative; display: grid; justify-items: center; gap: 4px; min-width: 50px; padding: 7px 5px; border: 1px solid var(--line); border-radius: 7px; background: var(--input); cursor: pointer; }
.studio-colors input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.studio-colors label:has(:checked) { border-color: var(--accent-text); background: var(--accent-wash); }
.studio-colors label:has(:focus-visible) { outline: 2px solid var(--accent-text); }
.color-dot { display: block; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(140deg,var(--c1),var(--c2)); }
.studio-colors small { font: 500 .64rem var(--mono); }
.studio-links { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px; }
.studio-links legend { padding: 0 5px; color: var(--mute); font-size: .78rem; }
.studio-links label { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 5px; font-size: .76rem; }
.studio-feedback, .nexus-studio-note { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: .75rem; color: var(--mute); }
#studioShortcutCount { font-family: var(--mono); }
#studioShortcutCount.at-limit { color: var(--accent-text); }
.studio-actions { margin-top: 0; }
.nexus-desk-head { display: flex; align-items: start; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.nexus-desk-head h2 { margin-block: 4px; }
.nexus-desk-head p { color: var(--mute); }
.nexus-desk-grid { display: grid; grid-template-columns: minmax(0,.6fr) minmax(0,1.4fr); gap: 12px; margin-top: 15px; }
.nexus-desk-saved, .nexus-desk-links a { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--input); }
.nexus-desk-saved { flex-direction: column; align-items: start; }
.nexus-desk-saved strong { font: 600 1.3rem var(--mono); }
.nexus-desk-saved a { color: var(--accent-text); font-size: .8rem; }
.nexus-desk-links { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; }
.nexus-desk-links a > .ic:last-child { margin-inline-start: auto; }
.nexus-desk-links a:hover { border-color: var(--accent-text); }
.home-vip-beacon { display: flex; align-items: center; gap: 10px; margin: 16px 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--accent-wash); }
.home-vip-emblem { color: var(--accent-text); }
.home-vip-title, .home-vip-sub { display: block; }
.home-vip-sub { color: var(--mute); font-size: .77rem; }
.home-vip-arr { margin-inline-start: auto; }
.nexus-modal-preview { display: grid; gap: 12px; }
.nexus-modal-preview .nexus-tier-pass { width: min(100%,360px); }
.nexus-modal-preview .btn { justify-self: start; }

/* Dialogs and feedback sit above both desktop and mobile navigation. */
.sheet-wrap, .vip-reveal {
  position: fixed;
  inset: 0;
  z-index: 45;
  display: grid;
  place-items: center;
  padding: 15px;
  background: #080e2bc9;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s,visibility .22s;
}
.sheet-wrap.on, .vip-reveal.show { visibility: visible; opacity: 1; pointer-events: auto; }
.sheet {
  width: min(100%,590px);
  max-height: calc(100dvh - 30px);
  overflow: auto;
  overscroll-behavior: contain;
  padding: clamp(15px,3vw,26px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 26px 85px #0007;
  transform: translateY(12px);
  transition: transform .25s var(--ease);
}
.sheet-wrap.on .sheet { transform: none; }
.sheet > .sheet-dismiss { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.boot-error { max-width: 520px; margin: 30px auto; display: grid; gap: 12px; justify-items: start; }
.sheet > :is(h2,h3,p,table) + :is(p,button,.btn,div) { margin-top: 12px; }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
/* The VIP welcome card leaves the page and navigation interactive. */
.vip-reveal {
  z-index: 47;
  inset: auto max(12px,env(safe-area-inset-right)) calc(var(--bottom-bar) + 12px) auto;
  max-width: calc(100% - 24px);
  padding: 0;
  background: none;
}
.vip-reveal.show { pointer-events: none; }
.vip-reveal.show .vip-reveal-card { pointer-events: auto; }
.vip-reveal-card { display: grid; justify-items: center; gap: 8px; max-width: min(100%,460px); padding: 25px; border: 1px solid var(--vip-accent,#a9c6ff); border-radius: 16px; background: var(--panel); text-align: center; }
.vip-reveal-card strong { font-size: clamp(1.25rem,4vw,2.15rem); }
.vip-reveal-card > p, .vip-reveal-crown { color: var(--accent-text); }
.vip-reveal-crown .ic { width: 30px; height: 30px; }
.toast {
  position: fixed;
  z-index: 55;
  right: max(16px,env(safe-area-inset-right));
  bottom: calc(var(--bottom-bar) + 14px);
  max-width: min(420px,calc(100% - 32px));
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  padding: 11px 13px;
  background: var(--raised);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  visibility: hidden;
  opacity: 0;
  translate: 0 12px;
  pointer-events: none;
  transition: opacity .22s,translate .22s,visibility .22s;
}
.toast.on { visibility: visible; opacity: 1; translate: 0 0; }
.toast-emblem { color: var(--ok); }
.toast.bad .toast-emblem { color: var(--bad); }
.toast-message { overflow-wrap: anywhere; }
.toast-timer { position: absolute; inset: auto 0 0; height: 2px; background: var(--acc); transform-origin: left; }
.toast.on .toast-timer { animation: toast-time 3.3s linear forwards; }
@keyframes toast-time { to { scale: 0 1; } }
#splash { position: fixed; inset: 0; display: grid; align-content: center; justify-items: center; gap: 11px; z-index: 80; background: var(--bg); transition: opacity .22s, visibility .22s; }
#splash.off { opacity: 0; visibility: hidden; pointer-events: none; }
#splash b { font: 600 .85rem var(--mono); }
.ring, .spin { width: 30px; height: 30px; border: 2px solid var(--line); border-top-color: var(--acc); border-radius: 50%; animation: loading .85s linear infinite; }
.spin { margin: 22px auto; }
@keyframes loading { to { transform: rotate(1turn); } }

@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference) {
  body:not(.calm) .tilt-card:hover { transform: perspective(940px) translateY(-4px) rotateX(2deg) rotateY(-2deg); }
  body:not(.calm) :is(.nexus-tier,.nexus-pass,.card):hover { box-shadow: var(--shadow); }
  body:not(.calm) .card:hover .catalog-art .ic { transform: translateY(-3px) rotate(-5deg); }
  body:not(.calm) .home-directory > a:hover { transform: perspective(850px) translateY(-3px) rotateX(2deg); }
}
@media (max-width: 1270px) {
  .nexus-tier-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media (max-width: 1030px) {
  :root { --bottom-bar: calc(61px + env(safe-area-inset-bottom,0px)); }
  .site-shell { display: block; }
  .top { height: auto; flex-direction: row; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .brand { padding: 0; border: 0; gap: 7px; }
  .mark { flex-basis: 32px; height: 32px; font-size: 1rem; }
  .dnav { display: none; }
  .tools { margin-top: 0; justify-content: flex-end; }
  .tabbar {
    position: fixed;
    inset: auto 0 0;
    z-index: 20;
    display: grid;
    grid-template-columns: repeat(5,minmax(0,1fr));
    gap: 3px;
    min-height: var(--bottom-bar);
    padding: 5px 6px max(5px,env(safe-area-inset-bottom,0px));
    border-top: 1px solid var(--line);
    background: var(--bg2);
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; padding: 5px 1px; border: 1px solid transparent; border-radius: 8px; color: var(--mute); text-align: center; font-size: .68rem; line-height: 1.18; transition: color .2s,background .2s; }
  .tabbar a.on {
    color: var(--section-accent);
    background: color-mix(in srgb,var(--section-accent) 16%,var(--bg2));
    border-color: color-mix(in srgb,var(--section-accent) 38%,var(--line));
  }
  .tabbar a .ic { width: 18px; height: 18px; }
  main { padding: 16px clamp(12px,3.3vw,30px) calc(var(--bottom-bar) + 13px); }
  html { scroll-padding-top: 70px; }
  .hero { min-height: 400px; }
}
@media (max-width: 700px) {
  .hero { grid-template-columns: minmax(0,1fr); min-height: auto; }
  .hero-copy { gap: 13px; padding: 24px 19px; }
  .hero-copy h1 { font-size: clamp(2rem,8vw,3.3rem); }
  .hero-image { min-height: 0; aspect-ratio: 1.85; }
  .home-directory { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .home-directory > a { min-height: 108px; padding: 12px; }
  .directory-arrow { inset: 12px 12px auto auto; }
  .ph { min-height: 130px; padding: 10px 0 18px; margin-bottom: 16px; }
  .nexus-landing, .nexus-member-body, .nexus-studio-grid { grid-template-columns: minmax(0,1fr); }
  .nexus-why-items { grid-template-columns: minmax(0,1fr); }
  .nexus-desk-grid { grid-template-columns: minmax(0,1fr); }
  .g3 { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .sheet-wrap { align-items: end; padding: 8px; }
  .sheet { max-height: min(86dvh,calc(100dvh - 20px)); margin-bottom: env(safe-area-inset-bottom,0px); }
}
@media (max-width: 470px) {
  .top { padding-inline: 9px; }
  .brand { font-size: .82rem; }
  .tools { gap: 4px; flex-wrap: nowrap; }
  #gear { gap: 3px; }
  #gear .icon-btn { width: 32px; height: 32px; min-height: 32px; }
  .nav-vip-marker { min-height: 32px; padding: 0 6px; }
  .nav-vip-marker span { display: none; }
  .home-section { margin-top: 30px; }
  .g2, .g3, .nexus-tier-grid { grid-template-columns: minmax(0,1fr); }
  .filters { gap: 5px; }
  .filters select, .chance-row select, .chance-row input { padding-inline: 5px; font-size: .84rem; }
  .reel-controls .reel-price-note { width: 100%; }
  .reel-controls .btn { flex: 1 1 110px; min-width: 0; }
  .reel-prize { min-height: 130px; }
  .mr, .library-item { grid-template-columns: 34px minmax(0,1fr); }
  .mr-save, .library-item .lib-toggle { grid-column: 2; }
  .library-item > a.btn { grid-column: 1; grid-row: 2; }
  .library-item .lib-toggle { justify-self: start; }
}
/* Admin cards and table cells can shrink independently of their contents. */
.pg[data-page="admin"] :is(.glass,.form,.field,.row,.ex-row,.table) { min-width: 0; max-width: 100%; }
.pg[data-page="admin"] .ex-row > :first-child { flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere; }
.pg[data-page="admin"] :is(.btn,td,th,code) { overflow-wrap: anywhere; }
.pg[data-page="admin"] :is(#usersBox,#ordersAdm) { min-width: 0; }
.pg[data-page="admin"] .table { overscroll-behavior-inline: contain; }
.pg[data-page="admin"] .table td .row { gap: 6px; }
.admin-cell { min-width: 0; overflow-wrap: anywhere; }
.admin-user-id { display: block; overflow-wrap: anywhere; }

@media (max-width: 640px) {
  .pg[data-page="admin"] :is(.g2,.g3) { grid-template-columns: minmax(0,1fr); }
  .pg[data-page="admin"] .chance-row {
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    gap: 6px 8px;
  }
  .pg[data-page="admin"] .chance-row > label { grid-column: 1 / -1; }
  .pg[data-page="admin"] :is(#usersBox,#ordersAdm) table { display: block; }
  .pg[data-page="admin"] .admin-table thead { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }
  .pg[data-page="admin"] .admin-table tbody { display: grid; }
  .pg[data-page="admin"] .admin-table tbody tr { display: grid; padding: 7px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
  .pg[data-page="admin"] .admin-table tbody tr:last-child { border-bottom: 0; }
  .pg[data-page="admin"] .admin-table td {
    display: grid; grid-template-columns: minmax(0,.8fr) minmax(0,1.2fr);
    gap: 6px; border: 0; padding: 5px 0; min-width: 0;
  }
  .pg[data-page="admin"] .admin-table td::before {
    content: attr(data-label); color: var(--mute); font-size: .76rem;
  }
  .pg[data-page="admin"] .admin-table td > * { min-width: 0; }
  .pg[data-page="admin"] .admin-table td:last-child .btn { justify-self: start; }
}

@media (max-width: 370px) {
  .top { gap: 5px; }
  .mark { display: none; }
  .nexus-desk-links { grid-template-columns: minmax(0,1fr); }
}

body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition-duration: .01ms !important; }
body.calm .tilt, body.calm .tilt-card, body.calm .btn { transform: none !important; translate: none !important; }
body.calm .rip, body.calm .snow-drift { display: none; }
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .tilt, .tilt-card, .btn { transform: none !important; translate: none !important; }
  .rip, .snow-drift { display: none; }
}

async function api(method, path, body, admin) {
  const headers = {"Content-Type":"application/json"};
  if (TOKEN) headers.Authorization = "Bearer " + TOKEN;
  if (admin && ADMIN) headers["x-admin-token"] = ADMIN;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), method === "GET" ? 12000 : 25000);
  try {
    let response, data;
    try {
      response = await fetch(path, {
        method, headers, signal: controller.signal,
        body: body === undefined || body === null ? undefined : JSON.stringify(body)
      });
      data = await response.json();
    } catch (error) {
      if (!response || response.ok || controller.signal.aborted) {
        const code = controller.signal.aborted ? "request_timeout" : "connection_error";
        throw Object.assign(new Error(code), {code});
      }
    }
    if (!response.ok) {
      const code = data?.error || "generic";
      throw Object.assign(new Error(code), {code, status:response.status});
    }
    return data;
  } finally {
    clearTimeout(timeout);
  }
}

const io = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    entry.target.classList.add("in");
    io.unobserve(entry.target);
  }
}, {threshold:.12});
function reveal(root){
  if (!S.motion || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root?.querySelectorAll(".rv:not(.in)").forEach(el => io.observe(el));
}

document.addEventListener("pointerdown", event => {
  if (!S.motion || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const button = event.target.closest(".btn:not(:disabled)");
  if (!button) return;
  const rect = button.getBoundingClientRect();
  const ripple = document.createElement("i");
  ripple.className = "rip";
  ripple.style.left = (event.clientX - rect.left) + "px";
  ripple.style.top = (event.clientY - rect.top) + "px";
  button.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

  return `<div class="glass table"><table><tr><th>#</th><th>${t("total")}</th><th>—</th></tr>${list.map(o=>`<tr><td><code>${esc(o.id)}</code></td><td>${money(o.total)}</td><td><span class="tag ${o.status==="paid"?"g":""}">${o.type==='vip'?(o.approvedAt?tri('VIP расталды','VIP активирован','VIP approved'):tri('VIP күтілуде','VIP ожидает','VIP pending')):o.status==="paid"?t("paid"):t("pend")}</span></td></tr>`).join("")}</table></div>`;
}

function updateChanceTotal(){
 const el=document.getElementById('chancesTotal'); if(!el)return;
 const inputs=[...document.querySelectorAll('[data-chance-id] input')];
 const sum=inputs.reduce((a,x)=>a+Math.round(Number(x.value)*100),0);
 el.textContent=tri('Жалпы: ','Всего: ','Total: ')+(sum/100).toFixed(2)+'% / 100%';
 el.style.color=sum===10000?'var(--ok)':'var(--bad)';
}

function fillForm(form,obj){
  for(const el of form.elements){
    if(!el.name) continue;
    if(el.type==="checkbox"){el.checked=!!obj[el.name];continue}
    const m=el.name.match(/^(.+)_(kk|ru|en)$/);
    let v;
    if(m) v=(obj[m[1]]||{})[m[2]];
    else if(el.name==="keys") v=(obj.keyMods||[]).join(", ");
    else v=obj[el.name];
    el.value=v??"";
  }
}
function formObj(form){
  const o={};
  new FormData(form).forEach((v,k)=>o[k]=v);
  if(form.elements.live) o.live=form.elements.live.checked;
  return o;
}

const REEL_LENGTH = 36;
const REEL_START = 4;
const REEL_GOAL = 28;
let REEL_LAST_WIN=null;
let reelAccountId=null;
let reelReadyAt=0;
let reelCooldownTimer;
let reelAnchor=REEL_START;
let completeReelAnimation=null;

function syncSpinButton(){
  clearTimeout(reelCooldownTimer);
  const button=document.getElementById("spinBtn");
  if(!button)return;
  const wait=Math.max(0,reelReadyAt-Date.now());
  button.disabled=SPIN||wait>0||!D?.prizes?.length;
  button.setAttribute("aria-busy",String(SPIN));
  button.classList.toggle("is-busy",SPIN);
  const caption=SPIN ? tri("Күтіңіз…","Подождите…","Please wait…")
    : wait ? t("spin")+" · "+Math.ceil(wait/1000)+"s" : t("spin");
  const label=button.querySelector(".reel-spin-label");
  if(label.textContent!==caption)label.textContent=caption;
  if(wait&&!SPIN)reelCooldownTimer=setTimeout(syncSpinButton,Math.min(1000,wait));
}
function reelTranslateTo(n){
  const viewport=document.getElementById('reelViewport');
  const card=document.querySelector(`[data-reel-n="${n}"]`);
  if(!viewport||!card)return 0;
  return viewport.clientWidth/2-(card.offsetLeft+card.offsetWidth/2);
}
function positionReel(track,index){
  track.style.transform=`translate3d(${reelTranslateTo(index)}px,0,0)`;
}
function initPrizeReel(){
  const track=document.getElementById('reelTrack');
  if(!track||!D?.prizes?.length||completeReelAnimation)return;
  reelAnchor=REEL_START;
  const selector=`[data-reel-n="${REEL_START}"]`;
  if(REEL_LAST_WIN)track.querySelector(selector).outerHTML=prizeCard(REEL_LAST_WIN,REEL_START);
  track.style.transition='none';
  positionReel(track,reelAnchor);
  track.querySelectorAll('.is-at-rest,.is-selected').forEach(el=>el.classList.remove('is-at-rest','is-selected'));
  track.querySelector(selector)?.classList.add(REEL_LAST_WIN?'is-selected':'is-at-rest');
}
function animateReelTo(prize,previousPrize){
  const track=document.getElementById('reelTrack');
  const machine=document.getElementById('winterReel');
  if(!track||!D?.prizes?.length)return Promise.resolve();
  const startSelector=`[data-reel-n="${REEL_START}"]`;
  const goalSelector=`[data-reel-n="${REEL_GOAL}"]`;
  return new Promise(resolve=>{
    const duration=(!S.motion||window.matchMedia('(prefers-reduced-motion: reduce)').matches)?180:5200;
    if(previousPrize)track.querySelector(startSelector).outerHTML=prizeCard(previousPrize,REEL_START);
    track.querySelector(goalSelector).outerHTML=prizeCard(prize,REEL_GOAL);
    track.querySelectorAll('.is-at-rest,.is-selected').forEach(el=>el.classList.remove('is-at-rest','is-selected'));
    machine?.classList.add('is-spinning');
    track.style.transition='none';
    positionReel(track,REEL_START);
    void track.offsetHeight;
    let done=false;
    let deadline;
    function finish(showResult=true){
      if(done)return;
      done=true;
      clearTimeout(deadline);
      track.removeEventListener('transitionend',onEnd);
      machine?.classList.remove('is-spinning');
      completeReelAnimation=null;
      if(showResult && track===document.getElementById('reelTrack')){
        track.style.transition='none';
        reelAnchor=REEL_GOAL;
        positionReel(track,reelAnchor);
        track.querySelector(goalSelector)?.classList.add('is-selected');
      }
      resolve();
    }
    function onEnd(event){
      if(event.target===track&&event.propertyName==='transform')finish();
    }
    if(document.hidden){finish();return}
    completeReelAnimation=finish;
    track.addEventListener('transitionend',onEnd);
    deadline=setTimeout(finish,duration+300);
    track.style.transition=`transform ${duration}ms cubic-bezier(.10,.77,.11,1)`;
    positionReel(track,REEL_GOAL);
  });
}
function updateReelResult(){
  if(!ME || !REEL_LAST_WIN)return;

async function spin(){
  if(SPIN)return;
  if(navigator.locks && ME){
    let callbackStarted=false;
    try{
      await navigator.locks.request('a782-wheel:'+ME.id,{ifAvailable:true},async lock=>{
        callbackStarted=true;
        if(!lock){toast(E[LANG].spin_busy,true);return}
        await performSpin();
      });
      return;
    }catch(error){
      if(callbackStarted){toast(errMsg(error),true);return}
    }
  }
  return performSpin();
}
async function performSpin(){
  if(SPIN)return;
  if(!TOKEN||!ME){toast(t('login'),true);location.hash='#me';return}
  if(!D?.prizes?.length){toast(t('nores'),true);return}
  const session=TOKEN, account=ME.id, pendingKey='a782-spin-pending:'+account;
  SPIN=true;
  try{
    syncSpinButton();
    const announcement=document.getElementById('reelAnnouncement');
    if(announcement)announcement.textContent=tri('Жүлде анықталып жатыр…','Выбираем приз…','Selecting reward…');
    let requestId=localStorage.getItem(pendingKey);
    if(!requestId){
      requestId=crypto.randomUUID?.() || Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(pendingKey,requestId);
    }
    const result=await api('POST','/api/wheel/spin',{requestId});
    if(result?.user?.id!==account || !result.prize)throw Object.assign(new Error('connection_error'),{code:'connection_error'});
    localStorage.removeItem(pendingKey);
    if(session!==TOKEN)return;
    const previousPrize=REEL_LAST_WIN;
    ME=result.user;
    reelReadyAt=Date.now()+(result.cooldownMs||0);
    REEL_LAST_WIN=result.prize;
    await animateReelTo(result.prize,previousPrize);
    if(session!==TOKEN)return;
    updateReelResult();
    toast(L(result.prize.label)+(result.code?` · ${result.code}`:''));
  }catch(error){
    if(error.status && error.status<500 && ![408,429].includes(error.status) && error.code!=='spin_busy')localStorage.removeItem(pendingKey);
    if(session!==TOKEN)return;
    const message=['request_timeout','connection_error'].includes(error.code)
      ? tri('Байланыс үзілді. Қайта басқанда осы айналым тексеріледі.','Связь прервалась. Повторный клик проверит это вращение.','Connection interrupted. Clicking again checks this spin.')
      : errMsg(error);
    const announcement=document.getElementById('reelAnnouncement');
    if(announcement)announcement.textContent=message;
    toast(message,true);
  }finally{
    SPIN=false;
    syncSpinButton();
  }
}

async function submitAdminForm(form){
  if(!form||!ADMIN_FORM_KINDS[form.getAttribute('id')]||form.dataset.submitting==='1')return;
  clearAdminFormError(form);
  const fields=formObj(form), kind=ADMIN_FORM_KINDS[form.getAttribute('id')];
  const hasText=prefix=>['kk','ru','en'].some(lang=>String(fields[prefix+'_'+lang]||'').trim());
  const titleError=tri('Атауын толтыр (KK, RU немесе EN).','Укажи название (KK, RU или EN).','Enter a title in KK, RU or EN.');
  if(kind==='products'){
    if(!hasText('name'))return adminFormError(form,titleError,'name_kk');
    const price=String(fields.price||'').trim();
    if(price===''||!/^\d+$/.test(price)||Number(price)>10000000){
      return adminFormError(form,tri('Бағаны дұрыс жаз: 0 ₸ немесе одан жоғары бүтін сан.','Укажи цену: целое число от 0 ₸.','Enter a valid whole-number price from 0 ₸.'),'price');
    }
  }else if(kind==='games'){
    if(!String(fields.name||'').trim())return adminFormError(form,titleError,'name');
  }else if(kind==='giveaways'){
    if(!hasText('title'))return adminFormError(form,titleError,'title_kk');
  }else if(kind==='modpacks'){
    if(!String(fields.title||'').trim())return adminFormError(form,titleError,'title');
  }
  const button=form.querySelector('[data-adminsubmit],button[type="submit"]');
  form.dataset.submitting='1';
  if(button)button.disabled=true;
  const originalText=button?button.innerHTML:'';
  if(button)button.textContent=tri('Сақталып жатыр…','Сохраняется…','Saving…');
  const status=form.querySelector('[data-admin-status]');
  if(status){status.textContent=tri('Серверге жіберіліп жатыр…','Отправка на сервер…','Sending to server…');status.style.color='var(--acc)'}
  try{
    await api('POST',ADMIN_ENDPOINT[kind],fields,true);
    await loadData();
    render(true);
    toast(tri('Сәтті қосылды / сақталды ✓','Добавлено / сохранено ✓','Added / saved ✓'));
  }catch(err){
    if(err.code==='admin_required'){
      // Render redeploy/restart clears server-side admin tokens, not sessionStorage.
      // Don't discard what the owner typed; reauthenticate and retry the clicked save.
      pendingAdminSave={id:form.getAttribute('id'),fields:{...fields}};
      clearAdminSession();
      render(true);
      toast(tri('PIN сессиясы аяқталды. Қайта PIN енгіз: тауар жоғалмайды.','Сессия PIN истекла. Введи PIN: данные не потеряются.','PIN session expired. Re-enter PIN; your draft is kept.'),true);
      document.querySelector('#pinForm input[name="pin"]')?.focus();
      return;
    }
    const reason=err.code==='title_required'?titleError:
      err.code==='admin_required'?tri('Админ сессиясы аяқталған. Қайта кір.','Сессия администратора истекла. Войди снова.','Admin session expired. Sign in again.'):
      err.code==='too_large'?tri('Дерек көлемі тым үлкен.','Слишком большой объём данных.','Payload is too large.'):
      tri('Сақталмады. Сервер жауабы: ','Не сохранено. Ответ сервера: ','Not saved. Server response: ')+(err.code||err.message||'generic')+(err.status?' (HTTP '+err.status+')':'');
    adminFormError(form,reason);
  }finally{
    delete form.dataset.submitting;
    if(form.isConnected&&button){button.disabled=false;button.innerHTML=originalText}
  }
}

const busyBalanceActions = new Set();
async function adminBal(spec){
  // All balance changes go through the existing admin-only server endpoint.
  // A pending click is locked so double-clicking can't subtract twice by accident.
  if(busyBalanceActions.has(spec))return;
  const [id,field,amount]=spec.split("|");
  const delta=Number(amount);
  if(!/^[a-zA-Z0-9_-]+$/.test(id)||!["tickets","tokens","diamonds"].includes(field)||!Number.isInteger(delta)||delta===0)return;
  busyBalanceActions.add(spec);
  const btn=[...document.querySelectorAll('[data-bal]')].find(b=>b.dataset.bal===spec);
  if(btn)btn.disabled=true;
  try{
    await api("POST",`/api/admin/users/${id}/balance`,{field,delta},true);
    await loadAdmin();
    toast(delta<0?tri('Билет алынды ✓','Билеты списаны ✓','Tickets removed ✓'):tri('Баланс жаңартылды ✓','Баланс обновлён ✓','Balance updated ✓'));
  }catch(e){toast(errMsg(e),true)}
  finally{
    busyBalanceActions.delete(spec);
    if(btn&&btn.isConnected)btn.disabled=false;
  }
}

  }catch(error){
    $("#splash").classList.add("off");
    $("#main").innerHTML=`<div class="notice boot-error"><p>${esc(errMsg(error))}</p><button type="button" class="btn" onclick="location.reload()">${tri('Қайта жүктеу','Перезагрузить','Reload')}</button></div>`;
    return;
  }
  if(TOKEN){
    try{ ME=(await api("GET","/api/me")).user }
    catch(error){
      if(error.status===401){TOKEN="";localStorage.removeItem("a782-token")}
      else toast(errMsg(error),true);
    }
  }
  render();
  $("#splash").classList.add("off");
})();
</script>

}
.table { max-width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 0; }
table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }

th { color: var(--mute); background: var(--input); font-weight: 640; }

.ex, .ex-row, .line, .total, .set {

.ex { margin-top: 8px; }
.ex-row, .line, .total { padding: 12px 0; border-block-end: 1px solid var(--line); }
.total { font-weight: 750; }
.qty { display: inline-flex; gap: 8px; align-items: center; }
.qty button { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); }
.chance-row { display: grid; grid-template-columns: minmax(70px,1fr) minmax(74px,110px) minmax(93px,136px); align-items: center; gap: 8px; padding-block: 9px; border-block-end: 1px solid var(--line); }
.chance-row label { font-size: .85rem; }
#chancesTotal { margin: 12px 0 8px; font: 600 .85rem var(--mono); }

.auth { width: min(100%,465px); }
.icons { display: flex; gap: 6px; flex-wrap: wrap; }
.prof-banner {
  min-height: 160px;
  padding: 17px clamp(15px,2.5vw,24px) 42px;

}
.prof-top { display: flex; position: relative; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 0 22px 14px; margin-top: -30px; }
.avatar-shell { position: relative; flex: none; padding: 4px; background: var(--panel); border-radius: 15px; }
.avatar, .nexus-preview-avatar { width: 70px; height: 70px; display: grid; place-items: center; overflow: hidden; border-radius: 12px; background: var(--raised); color: var(--accent-text); }
.avatar img, .nexus-preview-avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .ic, .nexus-preview-avatar .ic { width: 30px; height: 30px; }
.avatar-shell-vip { border: 1px solid var(--vip-accent); }
.avatar-crown { position: absolute; inset: auto -5px -5px auto; display: grid; place-items: center; width: 23px; height: 23px; background: var(--vip-accent); color: #14211b; border-radius: 6px; }
.profile-rank, .profile-custom-status { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--line); padding: 5px 9px; font-size: .79rem; border-radius: 7px; }
.profile-rank { border-color: color-mix(in srgb,var(--rank) 60%,var(--line)); }
.prof-banner-vip-top, .vip-identity-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .78rem; }
.prof-banner-huge { margin-top: 10px; font-size: clamp(2rem,5vw,3.8rem); font-weight: 850; letter-spacing: -.05em; color: #eaffed; }
.vip-identity-title { padding: 0 22px 14px; }
.vip-identity-title small { color: var(--mute); }
.switch { display: inline-flex; align-items: center; position: relative; cursor: pointer; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.switch span { display: block; width: 43px; height: 25px; border-radius: 20px; background: var(--input); border: 1px solid var(--line); }
.switch span::before { content: ""; display: block; width: 17px; height: 17px; margin: 3px; border-radius: 50%; background: var(--mute); transition: transform .22s; }
.switch input:checked + span { background: var(--accent-fill); }
.switch input:checked + span::before { transform: translateX(18px); background: var(--accent-ink); }
.switch input:focus-visible + span { outline: 2px solid var(--accent-text); outline-offset: 3px; }

/* Ticket gallery. Track positioning is the reference for the existing reel math. */
.reel-panel {
  --ticket-width: clamp(123px,15vw,162px);
  min-width: 0;
  padding: clamp(14px,2.2vw,24px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 19px;
  box-shadow: var(--shadow);
}
.reel-head { display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 16px; }
.reel-head p { color: var(--mute); margin-top: 6px; font-size: .9rem; }
.reel-counter {
  display: inline-grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  color: var(--accent-text);
  background: var(--accent-wash);
  border: 1px solid color-mix(in srgb,var(--acc) 31%,var(--line));
  border-radius: 9px;
  font-size: .8rem;
}
.reel-counter strong { font: 600 1.3rem var(--mono); }
.reel-machine {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 23px 0;
  border: 1px solid #42594c;
  border-radius: 11px;
  background:
    repeating-linear-gradient(90deg,transparent 0 23px,#b9e8cb09 23px 24px),
    linear-gradient(180deg,#182f2a,#0b1a16 59%,#1a342c);
}
.reel-viewport { overflow: hidden; min-width: 0; position: relative; }
.reel-viewport::after {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg,#0a1a16bf,transparent 13%,transparent 87%,#0a1a16bf);
}
.reel-track { position: relative; display: flex; gap: 11px; align-items: stretch; width: max-content; }
.reel-machine.is-spinning .reel-track { will-change: transform; }
:is(.reel-prize,.rarity-key > li) { --rarity: #a9bcb0; }
:is(.reel-prize,.rarity-key > li)[data-rarity="Rare"] { --rarity: #8ddde7; }
:is(.reel-prize,.rarity-key > li)[data-rarity="Epic"] { --rarity: #c7aff6; }
:is(.reel-prize,.rarity-key > li)[data-rarity="Legendary"] { --rarity: #f4ca80; }
:is(.reel-prize,.rarity-key > li)[data-rarity="Mythic"] { --rarity: #f1a6bc; }
.reel-prize {
  position: relative;
  display: grid;
  grid-template-rows: 38px 1fr auto;
  gap: 6px;
  width: var(--ticket-width);
  min-height: 140px;
  flex: none;
  padding: 11px 11px 8px;
  border: 2px solid var(--rarity);
  border-radius: 10px;
  color: #15241d;
  background: linear-gradient(155deg,color-mix(in srgb,var(--rarity) 38%,#f1f4e7),#d9e2cf);
}
.reel-prize[data-rarity="Mythic"] { border-style: double; border-width: 4px; padding: 9px 9px 6px; }
.reel-prize-icon { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid #344a3960; border-radius: 7px; color: #1f372b; background: #fbfff472; }
.reel-prize-icon .ic { width: 21px; height: 21px; }
.reel-prize b { line-height: 1.25; font-size: .9rem; overflow-wrap: anywhere; align-self: center; }
.reel-prize small { font: 600 .66rem/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding-top: 7px; border-top: 1px dashed #354b4270; color: #2d4036; }
.selection-window {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  inset: 12px auto 12px 50%;
  width: calc(var(--ticket-width) + 13px);
  transform: translateX(-50%);
  border: 1px solid #d4ee8b86;
  border-radius: 13px;
  box-shadow: inset 0 0 19px #d4ee8b15,0 0 15px #101b1391;
}
.selection-window::before, .selection-window::after { content: ""; position: absolute; inset-inline-start: calc(50% - 12px); width: 24px; height: 4px; background: #d4ee8b; border-radius: 2px; }
.selection-window::before { top: -2px; }
.selection-window::after { bottom: -2px; }
.reel-prize.is-selected {
  box-shadow: inset 0 0 0 2px #fcfff792, 0 0 18px color-mix(in srgb,var(--rarity) 50%,transparent);
  animation: prize-arrive .52s var(--ease) both;
}
@keyframes prize-arrive { from { scale: .97; filter: brightness(1.26); } to { scale: 1; filter: none; } }
.reel-empty { padding: 18px; color: #d9e9dd; }
.reel-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 16px; }
.reel-price-note { margin-inline-end: auto; color: var(--mute); display: inline-flex; align-items: center; gap: 7px; font-size: .83rem; }
.reel-spin-btn { min-width: min(100%,160px); }
.reel-spin-btn.is-busy { opacity: .65; }
.reel-rules { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
.rarity-key { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 11px; padding: 0; margin: 0; }
.rarity-key > li { color: var(--mute); display: inline-flex; align-items: center; gap: 5px; font: 500 .67rem var(--mono); }
.rarity-key > li::before { content: ""; width: 7px; height: 7px; background: var(--rarity); border-radius: 2px; }
:root[data-theme="light"] .rarity-key > li::before { outline: 1px solid #52665a; }
.reel-announcement { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 42px; padding: 8px 11px; margin-top: 12px; color: var(--mute); background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; font-size: .85rem; }
.reel-announcement b, .reel-announcement .ic { color: var(--accent-text); }
.odds-table { margin-block: 14px; }
.odds-table td, .odds-table th { padding: 8px; }
.reel-wallet { margin-top: 15px; }
